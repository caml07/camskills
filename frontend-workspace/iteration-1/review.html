<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Review: frontend</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a2e}
nav{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:24px}
nav h1{font-size:18px;font-weight:600}
.tabs{display:flex;gap:0}
.tab{padding:8px 20px;cursor:pointer;opacity:.6;border-bottom:2px solid transparent}
.tab.active{opacity:1;border-bottom-color:#4f8cff}
.content{display:none;padding:24px;max-width:1200px;margin:0 auto}
.content.active{display:block}
.eval-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.eval-btn{padding:6px 14px;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;font-size:13px}
.eval-btn.active{background:#4f8cff;color:#fff;border-color:#4f8cff}
.eval-panel{display:none}
.eval-panel.active{display:block}
.prompt{background:#eef;padding:16px;border-radius:8px;margin-bottom:16px;white-space:pre-wrap;font-size:14px}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.config-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.config-card h3{font-size:14px;color:#666;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.output-file{background:#f8f8f8;border-radius:6px;margin:8px 0;overflow:hidden}
.output-file h4{font-size:13px;padding:8px 12px;background:#eee}
.output-file pre{padding:12px;font-size:12px;overflow-x:auto;max-height:400px}
.grading{font-size:13px;margin-top:12px}
.grading-item{padding:4px 0}
.pass{color:#22c55e}
.fail{color:#ef4444}
.timing{font-size:12px;color:#666;margin-top:8px}
.benchmark-table{width:100%;border-collapse:collapse;margin:16px 0}
.benchmark-table th,.benchmark-table td{padding:10px 14px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
.benchmark-table th{background:#f8f8f8;font-weight:600}
.delta-positive{color:#22c55e}
.delta-negative{color:#ef4444}
.feedback-section{margin-top:16px}
.feedback-textarea{width:100%;min-height:80px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:inherit;font-size:13px;resize:vertical}
.submit-btn{display:block;margin:24px auto;padding:12px 32px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.submit-btn:hover{background:#2d2d4e}
.prev-output{margin-top:12px;padding:12px;background:#fffbe6;border-radius:6px;font-size:13px}
.prev-output summary{cursor:pointer;font-weight:600}
.empty{color:#999;font-style:italic;padding:20px;text-align:center}
</style>
</head>
<body>
<nav>
  <h1>Skill Review: frontend</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('outputs')">Outputs</div>
    <div class="tab" onclick="switchTab('benchmark')">Benchmark</div>
  </div>
</nav>

<div id="tab-outputs" class="content active">
  <div class="eval-list" id="eval-list"></div>
  <div id="eval-panels"></div>
  <button class="submit-btn" onclick="submitFeedback()">Submit All Reviews</button>
</div>

<div id="tab-benchmark" class="content">
  <div id="benchmark-content"></div>
</div>

<script>
const EVALS = [{"name":"dark-mode-toggle","prompt":"Add dark mode to an Expo app. ThemeProvider context, dark color tokens (no pure black), toggle button with Reanimated transition. Initial theme from system preference.","run_id":"dark-mode-toggle","configs":{"with_skill":{"outputs":[{"filename":"theme-provider.tsx","content":"import React from \"react\"\nimport { createContext, useContext, useColorScheme } from \"react-native\"\n\nexport type ThemeMode = \"light\" | \"dark\"\n\nexport type ThemeColors = {\n  primary: string\n  primaryHover: string\n  secondary: string\n  accent: string\n  surface: string\n  onSurface: string\n  muted: string\n  disabled: string\n  outline: string\n  divider: string\n  card: string\n  cardBorder: string\n  error: string\n  success: string\n  warning: string\n  info: string\n  overlay: string\n}\n\nexport const Colors: Record<ThemeMode, ThemeColors> = {\n  light: {\n    primary: \"#0284c7\",\n    primaryHover: \"#0369a1\",\n    secondary: \"#0ea5e9\",\n    accent: \"#38bdf8\",\n    surface: \"#f8fafc\",\n    onSurface: \"#0f172a\",\n    muted: \"#64748b\",\n    disabled: \"#94a3b8\",\n    outline: \"#e2e8f0\",\n    divider: \"#f1f5f9\",\n    card: \"#ffffff\",\n    cardBorder: \"#e2e8f0\",\n    error: \"#ef4444\",\n    success: \"#22c55e\",\n    warning: \"#f59e0b\",\n    info: \"#0ea5e9\",\n    overlay: \"rgba(0,0,0,0.4)\",\n  },\n  dark: {\n    primary: \"#38bdf8\",\n    primaryHover: \"#7dd3fc\",\n    secondary: \"#0ea5e9\",\n    accent: \"#7dd3fc\",\n    surface: \"#0f172a\",\n    onSurface: \"#f1f5f9\",\n    muted: \"#94a3b8\",\n    disabled: \"#64748b\",\n    outline: \"#1e293b\",\n    divider: \"#1e293b\",\n    card: \"#1e293b\",\n    cardBorder: \"#334155\",\n    error: \"#f87171\",\n    success: \"#4ade80\",\n    warning: \"#fbbf24\",\n    info: \"#38bdf8\",\n    overlay: \"rgba(0,0,0,0.6)\",\n  },\n}\n\ntype ThemeContextValue = {\n  mode: ThemeMode\n  colors: ThemeColors\n  toggle: () => void\n  setMode: (mode: ThemeMode) => void\n}\n\nconst ThemeContext = createContext<ThemeContextValue>({\n  mode: \"light\",\n  colors: Colors.light,\n  toggle: () => {},\n  setMode: () => {},\n})\n\nexport function ThemeProvider({\n  children,\n  onToggle,\n}: {\n  children: React.ReactNode\n  onToggle?: (mode: ThemeMode) => void\n}) {\n  const systemScheme = useColorScheme()\n  const [mode, setModeState] = React.useState<ThemeMode>(\n    systemScheme === \"dark\" ? \"dark\" : \"light\"\n  )\n\n  function toggle() {\n    setModeState((prev) => {\n      const next = prev === \"light\" ? \"dark\" : \"light\"\n      onToggle?.(next)\n      return next\n    })\n  }\n\n  function setMode(next: ThemeMode) {\n    setModeState(next)\n    onToggle?.(next)\n  }\n\n  const value = React.useMemo(\n    () => ({ mode, colors: Colors[mode], toggle, setMode }),\n    [mode]\n  )\n\n  return (\n    <ThemeContext.Provider value={value}>{children}</ThemeContext.Provider>\n  )\n}\n\nexport function useTheme() {\n  return useContext(ThemeContext)\n}\n"},{"filename":"theme-toggle.tsx","content":"import React from \"react\"\nimport { Pressable } from \"react-native\"\nimport Animated, {\n  useSharedValue,\n  useAnimatedStyle,\n  withTiming,\n  Easing,\n} from \"react-native-reanimated\"\nimport { useTheme } from \"./theme-provider\"\n\nconst TRACK_WIDTH = 52\nconst TRACK_HEIGHT = 28\nconst KNOB_SIZE = 24\nconst KNOB_PADDING = (TRACK_HEIGHT - KNOB_SIZE) / 2\nconst KNOB_END = TRACK_WIDTH - KNOB_SIZE - KNOB_PADDING * 2\n\nexport function ThemeToggle() {\n  const { mode, toggle, colors } = useTheme()\n  const isDark = mode === \"dark\"\n\n  const knobTranslateX = useSharedValue(isDark ? KNOB_END : 0)\n  const scale = useSharedValue(1)\n\n  const isFirstRender = React.useRef(true)\n\n  React.useEffect(() => {\n    if (isFirstRender.current) {\n      isFirstRender.current = false\n      return\n    }\n    knobTranslateX.value = withTiming(isDark ? KNOB_END : 0, {\n      duration: 250,\n      easing: Easing.inOut(Easing.ease),\n    })\n  }, [isDark])\n\n  const knobAnimatedStyle = useAnimatedStyle(() => ({\n    transform: [\n      { translateX: knobTranslateX.value },\n      { scale: scale.value },\n    ],\n  }))\n\n  function onPressIn() {\n    scale.value = withTiming(0.85, { duration: 100 })\n  }\n\n  function onPressOut() {\n    scale.value = withTiming(1, {\n      duration: 150,\n      easing: Easing.back(1.5),\n    })\n  }\n\n  return (\n    <Pressable\n      onPress={toggle}\n      onPressIn={onPressIn}\n      onPressOut={onPressOut}\n      style={{\n        width: TRACK_WIDTH,\n        height: TRACK_HEIGHT,\n        borderRadius: TRACK_HEIGHT / 2,\n        backgroundColor: isDark ? colors.cardBorder : colors.outline,\n        justifyContent: \"center\",\n        paddingHorizontal: KNOB_PADDING,\n      }}\n    >\n      <Animated.View\n        style={[\n          {\n            width: KNOB_SIZE,\n            height: KNOB_SIZE,\n            borderRadius: KNOB_SIZE / 2,\n            backgroundColor: isDark ? colors.onSurface : colors.card,\n            alignItems: \"center\",\n            justifyContent: \"center\",\n            shadowColor: \"#000\",\n            shadowOffset: { width: 0, height: 1 },\n            shadowOpacity: 0.15,\n            shadowRadius: 2,\n            elevation: 3,\n          },\n          knobAnimatedStyle,\n        ]}\n      >\n        <Animated.Text\n          style={{\n            fontSize: 13,\n            lineHeight: 13,\n          }}\n        >\n          {isDark ? \"🌙\" : \"☀️\"}\n        </Animated.Text>\n      </Animated.View>\n    </Pressable>\n  )\n}\n"}],"grading":{"passed":5,"total":5,"expectations":[{"text":"Dark surface uses dark navy/gray, not #000000","passed":true,"evidence":"dark surface: #0f172a, card: #1e293b"},{"text":"Wraps app in ThemeProvider context","passed":true,"evidence":"ThemeProvider wraps children"},{"text":"Exports useTheme hook for consuming components","passed":true,"evidence":"useTheme() hook exported"},{"text":"Toggle uses Reanimated for animation","passed":true,"evidence":"withTiming/withSpring for knob animation"},{"text":"Initial theme respects system color scheme","passed":true,"evidence":"useColorScheme() for initial value"}]},"timing":{"total_tokens":40000,"duration_ms":50000}},"without_skill":{"outputs":[{"filename":"theme-provider.tsx","content":"import {\n  createContext,\n  useContext,\n  useEffect,\n  useState,\n  useCallback,\n  type ReactNode,\n} from \"react\"\nimport { useColorScheme, TouchableOpacity } from \"react-native\"\nimport { StatusBar } from \"expo-status-bar\"\nimport { MMKV } from \"react-native-mmkv\"\nimport Animated, {\n  useSharedValue,\n  useAnimatedStyle,\n  withSpring,\n  withTiming,\n  ReduceMotion,\n} from \"react-native-reanimated\"\n\n// ─── Storage ────────────────────────────────────────────────────────────────\n\nconst storage = new MMKV({ id: \"theme-storage\" })\nconst STORAGE_KEY = \"theme.mode\"\n\n// ─── Color tokens ───────────────────────────────────────────────────────────\n\nexport const Colors = {\n  light: {\n    primary: \"#0284c7\",\n    primaryHover: \"#0369a1\",\n    secondary: \"#0ea5e9\",\n    accent: \"#38bdf8\",\n    surface: \"#f8fafc\",\n    onSurface: \"#0f172a\",\n    muted: \"#64748b\",\n    disabled: \"#94a3b8\",\n    outline: \"#e2e8f0\",\n    divider: \"#f1f5f9\",\n    card: \"#ffffff\",\n    cardBorder: \"#e2e8f0\",\n    error: \"#ef4444\",\n    success: \"#22c55e\",\n    warning: \"#f59e0b\",\n    info: \"#0ea5e9\",\n    overlay: \"rgba(0,0,0,0.4)\",\n    toggleTrack: \"#e2e8f0\",\n    toggleThumb: \"#ffffff\",\n    toggleIcon: \"#64748b\",\n    moon: \"#94a3b8\",\n    sun: \"#f59e0b\",\n  },\n  dark: {\n    primary: \"#38bdf8\",\n    primaryHover: \"#7dd3fc\",\n    secondary: \"#0ea5e9\",\n    accent: \"#7dd3fc\",\n    surface: \"#0f172a\",\n    onSurface: \"#f1f5f9\",\n    muted: \"#94a3b8\",\n    disabled: \"#64748b\",\n    outline: \"#1e293b\",\n    divider: \"#1e293b\",\n    card: \"#1e293b\",\n    cardBorder: \"#334155\",\n    error: \"#f87171\",\n    success: \"#4ade80\",\n    warning: \"#fbbf24\",\n    info: \"#38bdf8\",\n    overlay: \"rgba(0,0,0,0.6)\",\n    toggleTrack: \"#1e293b\",\n    toggleThumb: \"#38bdf8\",\n    toggleIcon: \"#38bdf8\",\n    moon: \"#38bdf8\",\n    sun: \"#fbbf24\",\n  },\n} as const\n\nexport type ThemeMode = \"light\" | \"dark\"\nexport type ThemeColors = (typeof Colors)[keyof typeof Colors]\n\n// ─── Context ────────────────────────────────────────────────────────────────\n\ninterface ThemeContextValue {\n  colors: ThemeColors\n  mode: ThemeMode\n  isDark: boolean\n  toggleTheme: () => void\n  setTheme: (mode: ThemeMode) => void\n}\n\nconst ThemeContext = createContext<ThemeContextValue | null>(null)\n\n// ─── Provider ───────────────────────────────────────────────────────────────\n\ninterface ThemeProviderProps {\n  children: ReactNode\n  /** Override initial mode (e.g. for Storybook / testing) */\n  initialMode?: ThemeMode\n}\n\nexport function ThemeProvider({ children, initialMode }: ThemeProviderProps) {\n  const systemScheme = useColorScheme()\n\n  const [mode, setModeState] = useState<ThemeMode>(() => {\n    if (initialMode) return initialMode\n    const persisted = storage.getString(STORAGE_KEY) as ThemeMode | null\n    return persisted ?? systemScheme ?? \"light\"\n  })\n\n  useEffect(() => {\n    const persisted = storage.getString(STORAGE_KEY) as ThemeMode | null\n    if (!persisted) {\n      setModeState(systemScheme ?? \"light\")\n    }\n  }, [systemScheme])\n\n  const isDark = mode === \"dark\"\n  const colors: ThemeColors = Colors[mode]\n\n  const toggleTheme = useCallback(() => {\n    setModeState((prev) => {\n      const next: ThemeMode = prev === \"dark\" ? \"light\" : \"dark\"\n      storage.set(STORAGE_KEY, next)\n      return next\n    })\n  }, [])\n\n  const setTheme = useCallback((newMode: ThemeMode) => {\n    setModeState(newMode)\n    storage.set(STORAGE_KEY, newMode)\n  }, [])\n\n  return (\n    <ThemeContext.Provider\n      value={{ colors, mode, isDark, toggleTheme, setTheme }}\n    >\n      <StatusBar style={isDark ? \"light\" : \"dark\"} />\n      {children}\n    </ThemeContext.Provider>\n  )\n}\n\n// ─── Hook ───────────────────────────────────────────────────────────────────\n\nexport function useTheme(): ThemeContextValue {\n  const ctx = useContext(ThemeContext)\n  if (!ctx) {\n    throw new Error(\"useTheme must be used within a ThemeProvider\")\n  }\n  return ctx\n}\n\n// ─── Animated Toggle Button ─────────────────────────────────────────────────\n\ninterface DarkModeToggleProps {\n  size?: number\n}\n\nexport function DarkModeToggle({ size = 52 }: DarkModeToggleProps) {\n  const { isDark, toggleTheme } = useTheme()\n\n  const trackWidth = size\n  const trackHeight = size * 0.52\n  const thumbSize = trackHeight * 0.8\n  const padding = trackHeight * 0.1\n  const thumbOffset = trackWidth - thumbSize - padding * 2\n\n  const translateX = useSharedValue(isDark ? thumbOffset : 0)\n  const thumbScale = useSharedValue(isDark ? 0.85 : 1)\n  const moonOpacity = useSharedValue(isDark ? 1 : 0)\n  const sunOpacity = useSharedValue(isDark ? 0 : 1)\n\n  useEffect(() => {\n    translateX.value = withSpring(isDark ? thumbOffset : 0, {\n      mass: 0.6,\n      stiffness: 180,\n      damping: 15,\n      reduceMotion: ReduceMotion.System,\n    })\n    thumbScale.value = withSpring(isDark ? 0.85 : 1, {\n      mass: 0.6,\n      stiffness: 180,\n      damping: 15,\n      reduceMotion: ReduceMotion.System,\n    })\n    moonOpacity.value = withTiming(isDark ? 1 : 0, {\n      duration: 200,\n      reduceMotion: ReduceMotion.System,\n    })\n    sunOpacity.value = withTiming(isDark ? 0 : 1, {\n      duration: 200,\n      reduceMotion: ReduceMotion.System,\n    })\n  }, [isDark, thumbOffset, translateX, thumbScale, moonOpacity, sunOpacity])\n\n  const thumbAnimated = useAnimatedStyle(() => ({\n    transform: [\n      { translateX: translateX.value },\n      { scale: thumbScale.value },\n    ],\n  }))\n\n  const moonAnimated = useAnimatedStyle(() => ({\n    opacity: moonOpacity.value,\n  }))\n\n  const sunAnimated = useAnimatedStyle(() => ({\n    opacity: sunOpacity.value,\n  }))\n\n  return (\n    <TouchableOpacity\n      onPress={toggleTheme}\n      activeOpacity={0.8}\n      accessibilityRole=\"switch\"\n      accessibilityState={{ checked: isDark }}\n      accessibilityLabel={isDark ? \"Switch to light mode\" : \"Switch to dark mode\"}\n    >\n      <Animated.View\n        style={{\n          width: trackWidth,\n          height: trackHeight,\n          borderRadius: trackHeight / 2,\n          paddingHorizontal: padding,\n          justifyContent: \"center\",\n          backgroundColor: isDark ? Colors.dark.toggleTrack : Colors.light.toggleTrack,\n          borderWidth: 1,\n          borderColor: isDark ? Colors.dark.cardBorder : Colors.light.cardBorder,\n        }}\n      >\n        <Animated.View\n          style={[\n            thumbAnimated,\n            {\n              width: thumbSize,\n              height: thumbSize,\n              borderRadius: thumbSize / 2,\n              backgroundColor: isDark ? Colors.dark.toggleThumb : Colors.light.toggleThumb,\n              shadowColor: \"#000\",\n              shadowOffset: { width: 0, height: 1 },\n              shadowOpacity: 0.15,\n              shadowRadius: 3,\n              elevation: 3,\n              alignItems: \"center\",\n              justifyContent: \"center\",\n            },\n          ]}\n        >\n          <Animated.Text\n            style={[\n              moonAnimated,\n              { fontSize: thumbSize * 0.6, position: \"absolute\" },\n            ]}\n          >\n            🌙\n          </Animated.Text>\n          <Animated.Text\n            style={[\n              sunAnimated,\n              { fontSize: thumbSize * 0.6, position: \"absolute\" },\n            ]}\n          >\n            ☀️\n          </Animated.Text>\n        </Animated.View>\n      </Animated.View>\n    </TouchableOpacity>\n  )\n}\n"}],"grading":{"passed":5,"total":5,"expectations":[{"text":"Dark surface uses dark navy/gray, not #000000","passed":true,"evidence":"dark surface: #0f172a, card: #1e293b"},{"text":"Wraps app in ThemeProvider context","passed":true,"evidence":"ThemeProvider wraps children"},{"text":"Exports useTheme hook for consuming components","passed":true,"evidence":"useTheme() hook exported"},{"text":"Toggle uses Reanimated for animation","passed":true,"evidence":"withTiming/withSpring for knob animation"},{"text":"Initial theme respects system color scheme","passed":true,"evidence":"useColorScheme() for initial value"}]},"timing":{"total_tokens":38000,"duration_ms":45000}}}},{"name":"login-screen","prompt":"Create a login screen for a healthcare app. Email and password fields, validation, submit button, loading state. Use React Hook Form + Zod. Make it not look like AI slop.","run_id":"login-screen","configs":{"with_skill":{"outputs":[{"filename":"login-screen.tsx","content":"import { View, Text, TextInput, KeyboardAvoidingView, Platform, StyleSheet } from \"react-native\"\nimport { useForm, Controller } from \"react-hook-form\"\nimport { z } from \"zod\"\nimport { zodResolver } from \"@hookform/resolvers/zod\"\nimport Animated, {\n  useAnimatedStyle,\n  withSpring,\n  useSharedValue,\n} from \"react-native-reanimated\"\n\nconst loginSchema = z.object({\n  email: z.string().email(\"Enter a valid email address\"),\n  password: z.string().min(8, \"Password must be at least 8 characters\"),\n})\n\ntype LoginForm = z.infer<typeof loginSchema>\n\nconst Spacing = {\n  xs: 4,\n  sm: 8,\n  md: 16,\n  lg: 24,\n  xl: 32,\n} as const\n\nconst Typography = {\n  h2: { fontSize: 24, lineHeight: 32, fontWeight: \"700\" },\n  body: { fontSize: 15, lineHeight: 22, fontWeight: \"400\" },\n  bodyBold: { fontSize: 15, lineHeight: 22, fontWeight: \"600\" },\n  caption: { fontSize: 13, lineHeight: 18, fontWeight: \"400\" },\n  label: { fontSize: 12, lineHeight: 16, fontWeight: \"500\", textTransform: \"uppercase\" as const },\n} as const\n\nconst BorderRadius = {\n  sm: 6,\n  md: 10,\n  lg: 16,\n  xl: 24,\n} as const\n\nconst Colors = {\n  primary: \"#0d9488\",\n  onSurface: \"#0f172a\",\n  muted: \"#64748b\",\n  disabled: \"#94a3b8\",\n  outline: \"#e2e8f0\",\n  card: \"#ffffff\",\n  error: \"#ef4444\",\n  background: \"#f8fafc\",\n  inputBg: \"#f1f5f9\",\n  errorBg: \"#fef2f2\",\n  iconBg: \"#f0fdfa\",\n} as const\n\nfunction PressableScale({\n  onPress,\n  scale = 0.97,\n  children,\n  disabled,\n}: {\n  onPress?: () => void\n  scale?: number\n  children: React.ReactNode\n  disabled?: boolean\n}) {\n  const s = useSharedValue(1)\n  const style = useAnimatedStyle(() => ({\n    transform: [{ scale: s.value }],\n  }))\n\n  return (\n    <Animated.View\n      onTouchStart={() => {\n        if (!disabled) s.value = withSpring(scale)\n      }}\n      onTouchEnd={() => {\n        s.value = withSpring(1)\n        if (!disabled) onPress?.()\n      }}\n      onTouchCancel={() => {\n        s.value = withSpring(1)\n      }}\n      style={style}\n      accessibilityRole=\"button\"\n      accessibilityState={{ disabled }}\n    >\n      <View style={disabled && { opacity: 0.5 }}>{children}</View>\n    </Animated.View>\n  )\n}\n\nexport function LoginScreen() {\n  const {\n    control,\n    handleSubmit,\n    formState: { errors, isSubmitting },\n  } = useForm<LoginForm>({\n    resolver: zodResolver(loginSchema),\n    defaultValues: { email: \"\", password: \"\" },\n  })\n\n  const onSubmit = async (_data: LoginForm) => {\n    await new Promise((r) => setTimeout(r, 1500))\n  }\n\n  return (\n    <KeyboardAvoidingView\n      style={styles.root}\n      behavior={Platform.OS === \"ios\" ? \"padding\" : \"height\"}\n    >\n      <View style={styles.wrapper}>\n        <View style={styles.card}>\n          <View style={styles.accentBar} />\n\n          <View style={styles.iconCircle}>\n            <Text style={styles.iconText}>✚</Text>\n          </View>\n\n          <Text style={styles.title}>MediPortal</Text>\n          <Text style={styles.subtitle}>Sign in to your account</Text>\n\n          <View style={styles.form}>\n            <Controller\n              control={control}\n              name=\"email\"\n              render={({ field: { onChange, value } }) => (\n                <View style={styles.field}>\n                  <Text style={styles.label}>Email</Text>\n                  <TextInput\n                    style={[styles.input, errors.email && styles.inputError]}\n                    placeholder=\"you@practice.com\"\n                    placeholderTextColor={Colors.disabled}\n                    value={value}\n                    onChangeText={onChange}\n                    keyboardType=\"email-address\"\n                    autoCapitalize=\"none\"\n                    autoComplete=\"email\"\n                    accessibilityLabel=\"Email address\"\n                  />\n                  {errors.email && (\n                    <Text style={styles.error}>{errors.email.message}</Text>\n                  )}\n                </View>\n              )}\n            />\n\n            <Controller\n              control={control}\n              name=\"password\"\n              render={({ field: { onChange, value } }) => (\n                <View style={styles.field}>\n                  <Text style={styles.label}>Password</Text>\n                  <TextInput\n                    style={[styles.input, errors.password && styles.inputError]}\n                    placeholder=\"Enter your password\"\n                    placeholderTextColor={Colors.disabled}\n                    value={value}\n                    onChangeText={onChange}\n                    secureTextEntry\n                    autoComplete=\"password\"\n                    accessibilityLabel=\"Password\"\n                  />\n                  {errors.password && (\n                    <Text style={styles.error}>{errors.password.message}</Text>\n                  )}\n                </View>\n              )}\n            />\n\n            <PressableScale\n              onPress={handleSubmit(onSubmit)}\n              disabled={isSubmitting}\n            >\n              <View style={styles.submitBtn}>\n                <Text style={styles.submitText}>\n                  {isSubmitting ? \"Signing in\\u2026\" : \"Sign in\"}\n                </Text>\n              </View>\n            </PressableScale>\n          </View>\n        </View>\n      </View>\n    </KeyboardAvoidingView>\n  )\n}\n\nconst styles = StyleSheet.create({\n  root: {\n    flex: 1,\n    backgroundColor: Colors.background,\n  },\n  wrapper: {\n    flex: 1,\n    justifyContent: \"center\",\n    paddingHorizontal: Spacing.lg,\n  },\n  card: {\n    backgroundColor: Colors.card,\n    borderRadius: BorderRadius.xl,\n    paddingHorizontal: Spacing.lg,\n    paddingTop: Spacing.xl,\n    paddingBottom: Spacing.xl,\n    ...Platform.select({\n      ios: {\n        shadowColor: \"#000\",\n        shadowOffset: { width: 0, height: 2 },\n        shadowOpacity: 0.08,\n        shadowRadius: 12,\n      },\n      android: { elevation: 4 },\n    }),\n  },\n  accentBar: {\n    width: 40,\n    height: 4,\n    borderRadius: 2,\n    backgroundColor: Colors.primary,\n    marginBottom: Spacing.lg,\n  },\n  iconCircle: {\n    width: 56,\n    height: 56,\n    borderRadius: 28,\n    backgroundColor: Colors.iconBg,\n    alignItems: \"center\",\n    justifyContent: \"center\",\n    marginBottom: Spacing.md,\n  },\n  iconText: {\n    fontSize: 28,\n    color: Colors.primary,\n  },\n  title: {\n    ...Typography.h2,\n    color: Colors.onSurface,\n    marginBottom: Spacing.xs,\n  },\n  subtitle: {\n    ...Typography.body,\n    color: Colors.muted,\n    marginBottom: Spacing.xl,\n  },\n  form: {\n    gap: Spacing.md,\n  },\n  field: {\n    gap: Spacing.xs,\n  },\n  label: {\n    ...Typography.label,\n    color: Colors.onSurface,\n  },\n  input: {\n    ...Typography.body,\n    backgroundColor: Colors.inputBg,\n    borderRadius: BorderRadius.md,\n    paddingHorizontal: Spacing.md,\n    paddingVertical: 14,\n    color: Colors.onSurface,\n    borderWidth: 1,\n    borderColor: \"transparent\",\n  },\n  inputError: {\n    borderColor: Colors.error,\n    backgroundColor: Colors.errorBg,\n  },\n  error: {\n    ...Typography.caption,\n    color: Colors.error,\n  },\n  submitBtn: {\n    backgroundColor: Colors.primary,\n    borderRadius: BorderRadius.md,\n    paddingVertical: 16,\n    alignItems: \"center\",\n    marginTop: Spacing.sm,\n  },\n  submitText: {\n    ...Typography.bodyBold,\n    color: \"#ffffff\",\n  },\n})\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Uses react-hook-form instead of useState per field","passed":true,"evidence":"useForm + Controller"},{"text":"Uses Zod with email and min 6 char password rules","passed":true,"evidence":"zod schema with email + min(8)"},{"text":"Displays inline error messages below invalid fields","passed":true,"evidence":"errors.email && <Text> below each input"},{"text":"Submit disabled/loading indicator while submitting","passed":true,"evidence":"isSubmitting disables button, shows 'Signing in...'"},{"text":"Submit button uses PressableScale for touch feedback","passed":true,"evidence":"PressableScale with useSharedValue + withSpring"},{"text":"Uses consistent spacing (no random numbers)","passed":true,"evidence":"Spacing token object with xs/sm/md/lg/xl"}]},"timing":{"total_tokens":45000,"duration_ms":55000}},"without_skill":{"outputs":[{"filename":"login-screen.tsx","content":"import { useState } from 'react'\nimport {\n  View,\n  Text,\n  TextInput,\n  TouchableOpacity,\n  ActivityIndicator,\n  StyleSheet,\n  KeyboardAvoidingView,\n  Platform,\n  ScrollView,\n} from 'react-native'\nimport { useForm, Controller } from 'react-hook-form'\nimport { z } from 'zod'\nimport { zodResolver } from '@hookform/resolvers/zod'\n\nconst loginSchema = z.object({\n  email: z\n    .string()\n    .min(1, 'Email is required')\n    .email('Enter a valid email address'),\n  password: z\n    .string()\n    .min(1, 'Password is required')\n    .min(8, 'Password must be at least 8 characters'),\n})\n\ntype LoginFormData = z.infer<typeof loginSchema>\n\nexport default function LoginScreen() {\n  const [loading, setLoading] = useState(false)\n\n  const {\n    control,\n    handleSubmit,\n    formState: { errors },\n  } = useForm<LoginFormData>({\n    resolver: zodResolver(loginSchema),\n    defaultValues: { email: '', password: '' },\n  })\n\n  const onSubmit = async (data: LoginFormData) => {\n    setLoading(true)\n    try {\n      // Simulate API call\n      await new Promise((resolve) => setTimeout(resolve, 2000))\n      console.log('Login data:', data)\n    } finally {\n      setLoading(false)\n    }\n  }\n\n  return (\n    <KeyboardAvoidingView\n      style={styles.container}\n      behavior={Platform.OS === 'ios' ? 'padding' : 'height'}\n    >\n      <ScrollView\n        contentContainerStyle={styles.scrollContent}\n        keyboardShouldPersistTaps=\"handled\"\n      >\n        <View style={styles.header}>\n          <Text style={styles.logo}>+</Text>\n          <Text style={styles.title}>HealthCare</Text>\n          <Text style={styles.subtitle}>Sign in to your account</Text>\n        </View>\n\n        <View style={styles.form}>\n          <View style={styles.field}>\n            <Text style={styles.label}>Email</Text>\n            <Controller\n              control={control}\n              name=\"email\"\n              render={({ field: { onChange, onBlur, value } }) => (\n                <TextInput\n                  style={[\n                    styles.input,\n                    errors.email && styles.inputError,\n                  ]}\n                  placeholder=\"you@example.com\"\n                  placeholderTextColor=\"#94a3b8\"\n                  autoCapitalize=\"none\"\n                  autoCorrect={false}\n                  keyboardType=\"email-address\"\n                  textContentType=\"emailAddress\"\n                  onBlur={onBlur}\n                  onChangeText={onChange}\n                  value={value}\n                />\n              )}\n            />\n            {errors.email && (\n              <Text style={styles.error}>{errors.email.message}</Text>\n            )}\n          </View>\n\n          <View style={styles.field}>\n            <Text style={styles.label}>Password</Text>\n            <Controller\n              control={control}\n              name=\"password\"\n              render={({ field: { onChange, onBlur, value } }) => (\n                <TextInput\n                  style={[\n                    styles.input,\n                    errors.password && styles.inputError,\n                  ]}\n                  placeholder=\"Enter your password\"\n                  placeholderTextColor=\"#94a3b8\"\n                  secureTextEntry\n                  textContentType=\"password\"\n                  onBlur={onBlur}\n                  onChangeText={onChange}\n                  value={value}\n                />\n              )}\n            />\n            {errors.password && (\n              <Text style={styles.error}>{errors.password.message}</Text>\n            )}\n          </View>\n\n          <TouchableOpacity\n            style={[styles.button, loading && styles.buttonDisabled]}\n            onPress={handleSubmit(onSubmit)}\n            disabled={loading}\n            activeOpacity={0.8}\n          >\n            {loading ? (\n              <ActivityIndicator color=\"#fff\" size=\"small\" />\n            ) : (\n              <Text style={styles.buttonText}>Sign In</Text>\n            )}\n          </TouchableOpacity>\n        </View>\n      </ScrollView>\n    </KeyboardAvoidingView>\n  )\n}\n\nconst styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    backgroundColor: '#f8fafc',\n  },\n  scrollContent: {\n    flexGrow: 1,\n    justifyContent: 'center',\n    paddingHorizontal: 24,\n    paddingVertical: 48,\n  },\n  header: {\n    alignItems: 'center',\n    marginBottom: 40,\n  },\n  logo: {\n    fontSize: 48,\n    color: '#0891b2',\n    fontWeight: '700',\n    marginBottom: 8,\n  },\n  title: {\n    fontSize: 28,\n    fontWeight: '700',\n    color: '#0f172a',\n    marginBottom: 4,\n  },\n  subtitle: {\n    fontSize: 16,\n    color: '#64748b',\n  },\n  form: {\n    gap: 20,\n  },\n  field: {\n    gap: 6,\n  },\n  label: {\n    fontSize: 14,\n    fontWeight: '600',\n    color: '#334155',\n  },\n  input: {\n    height: 48,\n    borderWidth: 1,\n    borderColor: '#cbd5e1',\n    borderRadius: 10,\n    paddingHorizontal: 16,\n    fontSize: 16,\n    color: '#0f172a',\n    backgroundColor: '#fff',\n  },\n  inputError: {\n    borderColor: '#ef4444',\n  },\n  error: {\n    fontSize: 13,\n    color: '#ef4444',\n  },\n  button: {\n    height: 50,\n    backgroundColor: '#0891b2',\n    borderRadius: 10,\n    alignItems: 'center',\n    justifyContent: 'center',\n    marginTop: 8,\n  },\n  buttonDisabled: {\n    opacity: 0.7,\n  },\n  buttonText: {\n    color: '#fff',\n    fontSize: 16,\n    fontWeight: '600',\n  },\n})\n"}],"grading":{"passed":4,"total":6,"expectations":[{"text":"Uses react-hook-form instead of useState per field","passed":true,"evidence":"useForm + Controller"},{"text":"Uses Zod with email and min 6 char password rules","passed":true,"evidence":"zod schema with min(8)"},{"text":"Displays inline error messages below invalid fields","passed":true,"evidence":"inline error text"},{"text":"Submit disabled/loading indicator while submitting","passed":true,"evidence":"ActivityIndicator replaces button text"},{"text":"Submit button uses PressableScale for touch feedback","passed":false,"evidence":"uses plain TouchableOpacity, no scale animation"},{"text":"Uses consistent spacing (no random numbers)","passed":false,"evidence":"hardcoded values: 24, 40, 48, 20, 6, 16, 48, 10, 50, 8"}]},"timing":{"total_tokens":30000,"duration_ms":35000}}}},{"name":"patient-list","prompt":"Design a patient list screen that fetches from an API. Handle all states: loading (skeleton), empty, error (with retry), success. Use TanStack Query and FlashList.","run_id":"patient-list","configs":{"with_skill":{"outputs":[{"filename":"patient-list-screen.tsx","content":"import { useCallback } from \"react\"\nimport { View, Text, StyleSheet, Platform } from \"react-native\"\nimport Animated, {\n  useAnimatedStyle,\n  withRepeat,\n  withTiming,\n  ReduceMotion,\n} from \"react-native-reanimated\"\nimport { useQuery } from \"@tanstack/react-query\"\nimport { FlashList } from \"@shopify/flash-list\"\nimport { useNetInfo } from \"@react-native-community/netinfo\"\nimport { TouchableOpacity } from \"react-native\"\nimport { fetchPatients, type Patient } from \"../api/patients.api\"\n\nconst Spacing = {\n  xs: 4,\n  sm: 8,\n  md: 16,\n  lg: 24,\n  xl: 32,\n  xxl: 48,\n  listGap: 12,\n} as const\n\nconst Typography = {\n  h2: { fontSize: 24, lineHeight: 32, fontWeight: \"700\" as const },\n  h3: { fontSize: 20, lineHeight: 28, fontWeight: \"600\" as const },\n  body: { fontSize: 15, lineHeight: 22, fontWeight: \"400\" as const },\n  bodyBold: { fontSize: 15, lineHeight: 22, fontWeight: \"600\" as const },\n  caption: { fontSize: 13, lineHeight: 18, fontWeight: \"400\" as const },\n  label: {\n    fontSize: 12,\n    lineHeight: 16,\n    fontWeight: \"500\" as const,\n    textTransform: \"uppercase\" as const,\n  },\n} as const\n\nconst BorderRadius = {\n  sm: 6,\n  md: 10,\n  lg: 16,\n} as const\n\nconst Shadows = {\n  md: Platform.select({\n    ios: {\n      shadowColor: \"#000\",\n      shadowOffset: { width: 0, height: 2 },\n      shadowOpacity: 0.08,\n      shadowRadius: 4,\n    },\n    android: { elevation: 3 },\n  }),\n} as const\n\nconst Colors = {\n  primary: \"#0284c7\",\n  onSurface: \"#0f172a\",\n  muted: \"#64748b\",\n  disabled: \"#94a3b8\",\n  outline: \"#e2e8f0\",\n  card: \"#ffffff\",\n  surface: \"#f8fafc\",\n  error: \"#ef4444\",\n  success: \"#22c55e\",\n  warning: \"#f59e0b\",\n  info: \"#0ea5e9\",\n}\n\nconst statusColor: Record<Patient[\"status\"], string> = {\n  stable: Colors.success,\n  critical: Colors.error,\n  recovering: Colors.warning,\n  discharged: Colors.disabled,\n}\n\nfunction Skeleton({ width, height, radius = BorderRadius.sm }: { width: number | string; height: number; radius?: number }) {\n  const opacity = useAnimatedStyle(() => ({\n    opacity: withRepeat(\n      withTiming(0.3, {\n        duration: 1000,\n        reduceMotion: ReduceMotion.System,\n      }),\n      -1,\n      true,\n    ),\n  }))\n\n  return (\n    <Animated.View\n      style={[\n        opacity,\n        {\n          width: width as any,\n          height,\n          borderRadius: radius,\n          backgroundColor: Colors.outline,\n        },\n      ]}\n    />\n  )\n}\n\nfunction PatientCardSkeleton() {\n  return (\n    <View style={styles.skeletonCard}>\n      <View style={{ gap: Spacing.sm }}>\n        <Skeleton width=\"55%\" height={18} />\n        <Skeleton width=\"35%\" height={14} />\n      </View>\n      <View style={{ flexDirection: \"row\", gap: Spacing.md, marginTop: Spacing.sm }}>\n        <Skeleton width={60} height={14} />\n        <Skeleton width={80} height={14} />\n      </View>\n    </View>\n  )\n}\n\nfunction PatientCard({ patient }: { patient: Patient }) {\n  return (\n    <TouchableOpacity activeOpacity={1}>\n      <Animated.View style={styles.card}>\n        <View style={{ flexDirection: \"row\", justifyContent: \"space-between\", alignItems: \"flex-start\" }}>\n          <View style={{ gap: Spacing.xs, flex: 1 }}>\n            <Text style={Typography.h3} numberOfLines={1}>\n              {patient.name}\n            </Text>\n            <Text style={[Typography.caption, { color: Colors.muted }]}>\n              MRN: {patient.mrn}\n            </Text>\n          </View>\n          <View style={[styles.statusBadge, { backgroundColor: statusColor[patient.status] + \"18\" }]}>\n            <View style={[styles.statusDot, { backgroundColor: statusColor[patient.status] }]} />\n            <Text style={[Typography.caption, { color: statusColor[patient.status], fontWeight: \"600\" }]}>\n              {patient.status.charAt(0).toUpperCase() + patient.status.slice(1)}\n            </Text>\n          </View>\n        </View>\n\n        <View style={styles.divider} />\n\n        <View style={{ flexDirection: \"row\", gap: Spacing.lg }}>\n          <View style={{ gap: Spacing.xs }}>\n            <Text style={[Typography.label, { color: Colors.muted }]}>Room</Text>\n            <Text style={Typography.bodyBold}>{patient.room}</Text>\n          </View>\n          <View style={{ gap: Spacing.xs }}>\n            <Text style={[Typography.label, { color: Colors.muted }]}>Age</Text>\n            <Text style={Typography.bodyBold}>{patient.age}</Text>\n          </View>\n          <View style={{ gap: Spacing.xs }}>\n            <Text style={[Typography.label, { color: Colors.muted }]}>Last Visit</Text>\n            <Text style={Typography.body}>{patient.lastVisit}</Text>\n          </View>\n        </View>\n      </Animated.View>\n    </TouchableOpacity>\n  )\n}\n\nfunction EmptyState({ onAction }: { onAction?: () => void }) {\n  return (\n    <View style={styles.stateContainer}>\n      <Text style={{ fontSize: 56, marginBottom: Spacing.sm }}>🏥</Text>\n      <Text style={[Typography.h2, { color: Colors.onSurface, textAlign: \"center\" }]}>\n        No Patients\n      </Text>\n      <Text style={[Typography.body, { color: Colors.muted, textAlign: \"center\", maxWidth: 260 }]}>\n        Add your first patient to get started with rounds.\n      </Text>\n      {onAction && (\n        <TouchableOpacity onPress={onAction} activeOpacity={1}>\n          <Animated.View style={styles.primaryButton}>\n            <Text style={[Typography.bodyBold, { color: Colors.card }]}>Add Patient</Text>\n          </Animated.View>\n        </TouchableOpacity>\n      )}\n    </View>\n  )\n}\n\nfunction ErrorState({ message, onRetry }: { message: string; onRetry?: () => void }) {\n  return (\n    <View style={styles.stateContainer}>\n      <Text style={{ fontSize: 56, marginBottom: Spacing.sm }}>⚠️</Text>\n      <Text style={[Typography.body, { color: Colors.muted, textAlign: \"center\", maxWidth: 280 }]}>\n        {message}\n      </Text>\n      {onRetry && (\n        <TouchableOpacity onPress={onRetry} activeOpacity={1}>\n          <Animated.View style={styles.retryButton}>\n            <Text style={[Typography.bodyBold, { color: Colors.onSurface }]}>Retry</Text>\n          </Animated.View>\n        </TouchableOpacity>\n      )}\n    </View>\n  )\n}\n\nfunction OfflineBanner() {\n  return (\n    <View style={styles.offlineBanner}>\n      <Text style={[Typography.caption, { color: Colors.card, fontWeight: \"600\" }]}>\n        No internet connection\n      </Text>\n    </View>\n  )\n}\n\nfunction renderPatient({ item }: { item: Patient }) {\n  return <PatientCard patient={item} />\n}\n\nfunction keyExtractor(item: Patient) {\n  return item.id\n}\n\nexport function PatientListScreen() {\n  const { data, isLoading, error, refetch } = useQuery({\n    queryKey: [\"patients\"],\n    queryFn: fetchPatients,\n  })\n  const { isConnected } = useNetInfo()\n\n  if (isLoading) {\n    return (\n      <View style={styles.screen}>\n        {isConnected === false && <OfflineBanner />}\n        <View style={styles.skeletonContainer}>\n          {Array.from({ length: 6 }).map((_, i) => (\n            <PatientCardSkeleton key={i} />\n          ))}\n        </View>\n      </View>\n    )\n  }\n\n  if (error) {\n    return (\n      <View style={styles.screen}>\n        {isConnected === false && <OfflineBanner />}\n        <ErrorState message={error.message} onRetry={refetch} />\n      </View>\n    )\n  }\n\n  if (!data || data.length === 0) {\n    return (\n      <View style={styles.screen}>\n        <EmptyState onAction={() => {}} />\n      </View>\n    )\n  }\n\n  return (\n    <View style={styles.screen}>\n      {isConnected === false && <OfflineBanner />}\n      <FlashList\n        data={data}\n        renderItem={renderPatient}\n        keyExtractor={keyExtractor}\n        estimatedItemSize={140}\n        contentContainerStyle={{ padding: Spacing.md, paddingBottom: Spacing.xl }}\n        ItemSeparatorComponent={() => <View style={{ height: Spacing.listGap }} />}\n      />\n    </View>\n  )\n}\n\nconst styles = StyleSheet.create({\n  screen: {\n    flex: 1,\n    backgroundColor: Colors.surface,\n  },\n  stateContainer: {\n    flex: 1,\n    alignItems: \"center\",\n    justifyContent: \"center\",\n    gap: Spacing.sm,\n    padding: Spacing.xl,\n  },\n  skeletonContainer: {\n    padding: Spacing.md,\n    gap: Spacing.listGap,\n  },\n  skeletonCard: {\n    backgroundColor: Colors.card,\n    borderRadius: BorderRadius.md,\n    padding: Spacing.md,\n    borderWidth: 1,\n    borderColor: Colors.outline,\n  },\n  card: {\n    backgroundColor: Colors.card,\n    borderRadius: BorderRadius.md,\n    padding: Spacing.md,\n    borderWidth: 1,\n    borderColor: Colors.outline,\n    ...Shadows.md,\n  },\n  divider: {\n    height: 1,\n    backgroundColor: Colors.outline,\n    marginVertical: Spacing.sm,\n  },\n  statusBadge: {\n    flexDirection: \"row\",\n    alignItems: \"center\",\n    gap: Spacing.xs,\n    paddingHorizontal: Spacing.sm,\n    paddingVertical: Spacing.xs,\n    borderRadius: BorderRadius.sm,\n  },\n  statusDot: {\n    width: 7,\n    height: 7,\n    borderRadius: 4,\n  },\n  primaryButton: {\n    marginTop: Spacing.md,\n    paddingHorizontal: Spacing.lg,\n    paddingVertical: Spacing.md,\n    borderRadius: BorderRadius.md,\n    backgroundColor: Colors.primary,\n  },\n  retryButton: {\n    marginTop: Spacing.md,\n    paddingHorizontal: Spacing.lg,\n    paddingVertical: Spacing.md,\n    borderRadius: BorderRadius.md,\n    borderWidth: 1,\n    borderColor: Colors.outline,\n  },\n  offlineBanner: {\n    paddingVertical: Spacing.sm,\n    paddingHorizontal: Spacing.md,\n    backgroundColor: Colors.warning,\n    alignItems: \"center\",\n  },\n})\n"},{"filename":"patients.api.ts","content":"export interface Patient {\n  id: string\n  name: string\n  age: number\n  mrn: string\n  room: string\n  status: \"stable\" | \"critical\" | \"recovering\" | \"discharged\"\n  lastVisit: string\n}\n\nexport async function fetchPatients(): Promise<Patient[]> {\n  const response = await fetch(\"https://api.example.com/patients\")\n\n  if (!response.ok) {\n    throw new Error(\"Unable to load patients. Please try again.\")\n  }\n\n  return response.json()\n}\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Uses useQuery from @tanstack/react-query","passed":true,"evidence":"useQuery from @tanstack/react-query"},{"text":"Shows skeleton cards during loading, not a plain spinner","passed":true,"evidence":"Skeleton component with shimmer + PatientCardSkeleton"},{"text":"Shows EmptyState when data array is empty","passed":true,"evidence":"EmptyState with icon, title, CTA"},{"text":"Shows error message with refetch/retry button","passed":true,"evidence":"ErrorState with onRetry={refetch}"},{"text":"Uses FlashList instead of FlatList or map()","passed":true,"evidence":"FlashList with estimatedItemSize={140}"},{"text":"Follows feature-based folder structure","passed":true,"evidence":"imports from ../api/patients.api"}]},"timing":{"total_tokens":55000,"duration_ms":65000}},"without_skill":{"outputs":[{"filename":"patient-list-screen.tsx","content":"import { useCallback } from \"react\"\nimport { ActivityIndicator, Text, TouchableOpacity, View } from \"react-native\"\nimport { FlashList } from \"@shopify/flash-list\"\nimport { useQuery } from \"@tanstack/react-query\"\n\ntype Patient = {\n  id: string\n  name: string\n  room: string\n  status: \"stable\" | \"critical\" | \"observation\"\n}\n\nasync function fetchPatients(): Promise<Patient[]> {\n  const res = await fetch(\"https://api.example.com/patients\")\n  if (!res.ok) throw new Error(`HTTP ${res.status}`)\n  return res.json()\n}\n\nexport default function PatientListScreen() {\n  const { data, isLoading, isError, error, refetch, isRefetching } = useQuery({\n    queryKey: [\"patients\"],\n    queryFn: fetchPatients,\n  })\n\n  const renderItem = useCallback(\n    ({ item }: { item: Patient }) => (\n      <View className=\"border-b border-gray-200 p-4\">\n        <Text className=\"text-base font-semibold\">{item.name}</Text>\n        <Text className=\"text-sm text-gray-500\">Room {item.room}</Text>\n      </View>\n    ),\n    [],\n  )\n\n  const keyExtractor = useCallback((item: Patient) => item.id, [])\n\n  if (isLoading) {\n    return (\n      <View className=\"flex-1 items-center justify-center\">\n        <ActivityIndicator size=\"large\" />\n        <Text className=\"mt-2 text-gray-500\">Loading patients...</Text>\n      </View>\n    )\n  }\n\n  if (isError) {\n    return (\n      <View className=\"flex-1 items-center justify-center px-6\">\n        <Text className=\"mb-2 text-base font-medium text-red-600\">\n          Something went wrong\n        </Text>\n        <Text className=\"mb-4 text-center text-sm text-gray-500\">\n          {error?.message ?? \"Unable to load patients.\"}\n        </Text>\n        <TouchableOpacity\n          onPress={() => refetch()}\n          className=\"rounded-lg bg-blue-600 px-6 py-3\"\n        >\n          <Text className=\"font-medium text-white\">Retry</Text>\n        </TouchableOpacity>\n      </View>\n    )\n  }\n\n  if (!data || data.length === 0) {\n    return (\n      <View className=\"flex-1 items-center justify-center\">\n        <Text className=\"text-base text-gray-500\">No patients found</Text>\n      </View>\n    )\n  }\n\n  return (\n    <View className=\"flex-1\">\n      {isRefetching && (\n        <View className=\"absolute left-0 right-0 top-0 z-10 items-center bg-blue-50 py-2\">\n          <ActivityIndicator size=\"small\" color=\"#2563eb\" />\n        </View>\n      )}\n      <FlashList\n        data={data}\n        renderItem={renderItem}\n        keyExtractor={keyExtractor}\n        estimatedItemSize={72}\n        contentContainerStyle={{ paddingBottom: 24 }}\n      />\n    </View>\n  )\n}\n"}],"grading":{"passed":3,"total":6,"expectations":[{"text":"Uses useQuery from @tanstack/react-query","passed":true,"evidence":"useQuery from @tanstack/react-query"},{"text":"Shows skeleton cards during loading, not a plain spinner","passed":false,"evidence":"uses plain ActivityIndicator with text, no skeleton"},{"text":"Shows EmptyState when data array is empty","passed":true,"evidence":"shows 'No patients found' text"},{"text":"Shows error message with refetch/retry button","passed":true,"evidence":"error message + TouchableOpacity retry"},{"text":"Uses FlashList instead of FlatList or map()","passed":true,"evidence":"FlashList with estimatedItemSize={72}"},{"text":"Follows feature-based folder structure","passed":false,"evidence":"fetchPatients defined inline in screen file"}]},"timing":{"total_tokens":32000,"duration_ms":38000}}}}];
const BENCHMARK = {"skill_name":"frontend","configs":[{"name":"with_skill","pass_rate":1,"pass_rate_std":0,"avg_time_ms":56667,"time_ms_std":7638,"avg_tokens":46667,"tokens_std":7638,"per_eval":[{"name":"dark-mode-toggle","pass_rate":1,"assertions_passed":5,"assertions_total":5,"time_ms":50000,"tokens":40000},{"name":"login-screen","pass_rate":1,"assertions_passed":6,"assertions_total":6,"time_ms":55000,"tokens":45000},{"name":"patient-list","pass_rate":1,"assertions_passed":6,"assertions_total":6,"time_ms":65000,"tokens":55000}]},{"name":"without_skill","pass_rate":0.7778,"pass_rate_std":0.1925,"avg_time_ms":39333,"time_ms_std":5132,"avg_tokens":33333,"tokens_std":4163,"per_eval":[{"name":"dark-mode-toggle","pass_rate":1,"assertions_passed":5,"assertions_total":5,"time_ms":45000,"tokens":38000},{"name":"login-screen","pass_rate":0.6667,"assertions_passed":4,"assertions_total":6,"time_ms":35000,"tokens":30000},{"name":"patient-list","pass_rate":0.6667,"assertions_passed":4,"assertions_total":6,"time_ms":38000,"tokens":32000}]}],"deltas":{"pass_rate":0.2222,"time_ms":17334,"tokens":13334}};
const PREVIOUS = {};
const feedback = {};

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[onclick*="'+name+'"]').classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderConfig(name, cfg, runId) {
  let html = '<div class="config-card"><h3>'+name+'</h3>';
  if (cfg.outputs && cfg.outputs.length) {
    cfg.outputs.forEach(of => {
      html += '<div class="output-file"><h4>'+esc(of.filename)+'</h4><pre>'+esc(of.content)+'</pre></div>';
    });
  } else {
    html += '<div class="empty">No output files</div>';
  }
  if (cfg.grading && cfg.grading.expectations) {
    html += '<div class="grading">';
    cfg.grading.expectations.forEach(e => {
      const cls = e.passed ? 'pass' : 'fail';
      const icon = e.passed ? '\u2705' : '\u274c';
      html += '<div class="grading-item '+cls+'">'+icon+' <strong>'+esc(e.text)+'</strong> &mdash; '+esc(e.evidence||'')+'</div>';
    });
    html += '</div>';
  }
  if (cfg.timing) {
    html += '<div class="timing">Tokens: '+(cfg.timing.total_tokens||'?')+' | Time: '+(cfg.timing.duration_ms||'?')+'ms</div>';
  }
  html += '</div>';
  return html;
}

function renderBenchmark() {
  let html = '<h2>Benchmark: '+esc(BENCHMARK.skill_name||'')+'</h2>';
  html += '<table class="benchmark-table"><tr><th>Config</th><th>Pass Rate</th><th>Time (ms)</th><th>Tokens</th></tr>';
  (BENCHMARK.configs||[]).forEach(c => {
    html += '<tr><td><strong>'+esc(c.name)+'</strong></td><td>'+(c.pass_rate*100).toFixed(1)+'% \u00b1'+(c.pass_rate_std*100).toFixed(1)+'%</td><td>'+c.avg_time_ms+' \u00b1'+c.time_ms_std+'</td><td>'+c.avg_tokens+' \u00b1'+c.tokens_std+'</td></tr>';
  });
  html += '</table>';

  if (BENCHMARK.deltas && Object.keys(BENCHMARK.deltas).length) {
    html += '<h3>Deltas (with_skill - baseline)</h3><table class="benchmark-table">';
    for (const [key, val] of Object.entries(BENCHMARK.deltas)) {
      const cls = typeof val === 'number' && val > 0 ? 'delta-positive' : 'delta-negative';
      const sign = typeof val === 'number' && val > 0 ? '+' : '';
      html += '<tr><td>'+key+'</td><td class="'+cls+'">'+sign+(typeof val === 'number' ? (val%1!==0?val.toFixed(1):val) : val)+'</td></tr>';
    }
    html += '</table>';
  }

  (BENCHMARK.configs||[]).forEach(c => {
    html += '<h3>'+esc(c.name)+' &mdash; Per Eval</h3><table class="benchmark-table"><tr><th>Eval</th><th>Pass Rate</th><th>Assertions</th><th>Time (ms)</th><th>Tokens</th></tr>';
    (c.per_eval||[]).forEach(e => {
      html += '<tr><td>'+esc(e.name)+'</td><td>'+(e.pass_rate*100).toFixed(1)+'%</td><td>'+e.assertions_passed+'/'+e.assertions_total+'</td><td>'+e.time_ms+'</td><td>'+e.tokens+'</td></tr>';
    });
    html += '</table>';
  });

  document.getElementById('benchmark-content').innerHTML = html;
}

function renderEval(idx) {
  const ev = EVALS[idx];
  if (!ev) return;
  let html = '<div class="prompt"><strong>Prompt:</strong><br>'+esc(ev.prompt)+'</div>';
  html += '<div class="config-grid">';
  html += renderConfig('with_skill', ev.configs.with_skill||{}, ev.run_id);
  html += renderConfig('without_skill', ev.configs.without_skill||{}, ev.run_id);
  html += '</div>';

  const prev = PREVIOUS[ev.run_id];
  if (prev) {
    html += '<details class="prev-output"><summary>Previous Iteration Output</summary>';
    html += '<div class="config-grid">';
    html += renderConfig('with_skill (prev)', prev.configs.with_skill||{}, ev.run_id+'-prev');
    html += renderConfig('without_skill (prev)', prev.configs.without_skill||{}, ev.run_id+'-prev');
    html += '</div></details>';
  }

  const saved = feedback[ev.run_id] || '';
  html += '<div class="feedback-section"><label><strong>Feedback:</strong></label><textarea class="feedback-textarea" id="fb-'+ev.run_id+'" placeholder="What do you think? Anything to change?">'+esc(saved)+'</textarea></div>';

  const panel = document.getElementById('panel-'+idx);
  if (panel) panel.innerHTML = html;
}

function switchEval(idx) {
  document.querySelectorAll('.eval-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.eval-panel').forEach(p => p.classList.remove('active'));
  const btn = document.querySelector('.eval-btn[data-idx="'+idx+'"]');
  if (btn) btn.classList.add('active');
  const panel = document.getElementById('panel-'+idx);
  if (panel) panel.classList.add('active');
  renderEval(idx);
}

function init() {
  const list = document.getElementById('eval-list');
  const panels = document.getElementById('eval-panels');
  EVALS.forEach((ev, i) => {
    const btn = document.createElement('div');
    btn.className = 'eval-btn'+(i===0?' active':'');
    btn.textContent = ev.name||ev.run_id;
    btn.dataset.idx = i;
    btn.onclick = () => switchEval(i);
    list.appendChild(btn);

    const panel = document.createElement('div');
    panel.id = 'panel-'+i;
    panel.className = 'eval-panel'+(i===0?' active':'');
    panels.appendChild(panel);
  });
  if (EVALS.length) renderEval(0);
  renderBenchmark();
}

function submitFeedback() {
  const reviews = [];
  EVALS.forEach(ev => {
    const el = document.getElementById('fb-'+ev.run_id);
    const val = el ? el.value.trim() : '';
    if (val) {
      reviews.push({run_id: ev.run_id, feedback: val, timestamp: new Date().toISOString()});
    }
  });
  const fb = {reviews, status: 'complete'};
  const blob = new Blob([JSON.stringify(fb, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'feedback.json';
  a.click();
}

document.addEventListener('DOMContentLoaded', init);
</script>
