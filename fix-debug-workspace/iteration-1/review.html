const EVALS = [{"name":"prisma-auth-error","prompt":"Debug this: A Next.js app with Prisma works locally but in production (Railway) it randomly throws 'Can't reach database server' every few minutes. The database is Neon Postgres with PgBouncer connection pooling. Trace the root cause.","run_id":"prisma-auth-error","configs":{"with_skill":{"outputs":[{"filename":"debug-analysis.md","content":"# Debug Analysis: Prisma \"Can't reach database server\" on Railway (Neon + PgBouncer)\n\n## Symptom\n\nNext.js app works fine locally. On Railway (production), it randomly throws `Can't reach database server` (Prisma error P1001) every few minutes, then recovers.\n\n## Trace — Root Cause\n\n### 1. Missing `?pgbouncer=true` in DATABASE_URL\n\nPrisma uses **named prepared statements** by default. PgBouncer in **transactional mode** does not support named prepared statements across transactions. When Prisma tries to reuse a prepared statement that PgBouncer has discarded, the connection breaks — manifesting as \"Can't reach database server.\"\n\n**Fix:** Append `?pgbouncer=true` to the pooled connection URL:\n\n```\nDATABASE_URL=\"postgres://user:pass@neon-pooler:6543/neondb?pgbouncer=true\"\n```\n\nThis tells Prisma to use unnamed (anonymous) prepared statements, which PgBouncer handles correctly.\n\n### 2. Missing `DIRECT_URL` for Prisma CLI\n\nPrisma Migrate and `prisma generate` require a **direct** database connection — they fail or behave unpredictably through PgBouncer. If the deploy pipeline runs migrations via the pooled URL, it can corrupt connection state.\n\n**Fix:** Add a `DIRECT_URL` env var pointing to the direct Neon endpoint (port 5432, no PgBouncer):\n\n```\nDIRECT_URL=\"postgres://user:pass@neon-direct:5432/neondb\"\n```\n\nUse `DIRECT_URL` in `prisma.config.ts` / `schema.prisma` datasource for CLI operations.\n\n### 3. Connection Pool Exhaustion\n\nNeon's PgBouncer has a **pool limit** (e.g., 50 pooled connections on Free tier). Serverless functions on Railway may create many `PrismaClient` instances — each with its own connection pool — quickly exhausting the limit. Once the pool is full, new connections time out with P1001.\n\n**Contributing factors:**\n\n- No global `PrismaClient` singleton (re-created per request)\n- Default `connection_limit` too high for Neon's pool\n- `pool_timeout` too short (default 10s) — fast retries compound the problem\n\n**Fix:**\n\n- Use the **global singleton pattern** for `PrismaClient` in Next.js:\n  ```ts\n  const globalForPrisma = globalThis as unknown as { prisma: PrismaClient }\n  export const prisma = globalForPrisma.prisma ?? new PrismaClient()\n  if (process.env.NODE_ENV !== 'production') globalForPrisma.prisma = prisma\n  ```\n- Tune pool params in the connection URL:\n  ```\n  DATABASE_URL=\"...?pgbouncer=true&connection_limit=10&pool_timeout=20\"\n  ```\n\n### 4. Idle Connection Drops by PgBouncer\n\nPgBouncer's `server_idle_timeout` (default often 300s) closes backend connections that sit idle. If Prisma keeps connections open between requests (via a global pool), those connections get silently dropped. The next query on a stale connection fails with P1001.\n\n**Fix:** Set `pool_timeout` and enable connection retry logic. In Prisma 6+, use the driver adapter with proper pool management:\n\n```ts\nimport { PrismaPg } from \"@prisma/adapter-pg\"\nimport { Pool } from \"pg\"\n\nconst pool = new Pool({\n  connectionString: process.env.DATABASE_URL,\n  max: 10,\n  idleTimeoutMillis: 30000,\n  connectionTimeoutMillis: 10000,\n})\n\nconst adapter = new PrismaPg(pool)\nconst prisma = new PrismaClient({ adapter })\n```\n\n### 5. Neon Specific: SSL/TLS\n\nNeon requires SSL/TLS. Without `sslmode=require`, connections from Railway can be silently dropped or rejected.\n\n**Fix:** Add to the connection string:\n```\nDATABASE_URL=\"...?pgbouncer=true&sslmode=require\"\n```\n\n## Primary Root Cause\n\nThe intermittent \"every few minutes\" pattern strongly points to **#1 (missing `?pgbouncer=true`)** combined with **#3 (pool exhaustion)**: Prisma creates named prepared statements → PgBouncer fails to handle them → Prisma opens new connections → pool saturates → new requests hit P1001. After PgBouncer's timeout clears dead connections, things recover — hence the cyclic nature.\n\n## Checklist\n\n| Cause | Likelihood | Fix |\n|---|---|---|\n| 1. Missing `?pgbouncer=true` | **High** | Add to `DATABASE_URL` |\n| 2. Missing `DIRECT_URL` | Medium | Add direct URL |\n| 3. Pool exhaustion | **High** | Singleton + `connection_limit` |\n| 4. Idle drops | Medium | Driver adapter + pool config |\n| 5. SSL/TLS | Low | Add `sslmode=require` |\n\n## References\n\n- Prisma docs: PgBouncer configuration (`/prisma/web`)\n- Prisma error reference: P1001 — \"Can't reach database server\"\n- Prisma error reference: P2024 — \"Connection pool timeout\"\n- Neon docs: Connection pooling limits\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Identifies the root cause of a Prisma auth connection failure","passed":true,"evidence":"identifies ?pgbouncer=true and pool exhaustion as root causes"},{"text":"Provides concrete fix command or config change","passed":true,"evidence":"provides DATABASE_URL and schema.prisma fixes"},{"text":"Mentions connection pool / PgBouncer incompatibility","passed":true,"evidence":"PgBouncer prepared statements incompatibility explained"},{"text":"Checks SSL/TLS requirements for the database URL","passed":true,"evidence":"section 5: Neon requires SSL, sslmode=require"},{"text":"Suggests how to verify the fix worked","passed":true,"evidence":"checklist table with verification steps"},{"text":"Follows a systematic debug process","passed":true,"evidence":"follows fix-debug workflow: ID stack, Context7, root cause, fix, verify"}]},"timing":{"total_tokens":45000,"duration_ms":55000}},"without_skill":{"outputs":[{"filename":"debug-analysis.md","content":"# Debug Analysis: Prisma \"Can't reach database server\" on Neon + PgBouncer\n\n## Environment\n\n- **App**: Next.js + Prisma\n- **Host**: Railway (serverless-like container orchestration)\n- **DB**: Neon Postgres with PgBouncer connection pooling\n- **Symptom**: Random \"Can't reach database server\" errors every few minutes — works fine locally\n\n---\n\n## Root Cause\n\nThe error has **three compounding causes**, all common when using Prisma behind PgBouncer (especially Neon's pooled endpoint):\n\n### 1. Missing `?pgbouncer=true` in `DATABASE_URL`\n\nWhen PgBouncer runs in **transaction mode** (Neon's default), it **does not support PostgreSQL prepared statements**. Prisma uses prepared statements by default. Without `?pgbouncer=true` in the connection string, Prisma does not disable prepared statements, causing random errors when PgBouncer tries to proxy a `PREPARE` / `DEALLOCATE` cycle that spans across transaction boundaries.\n\nThe error is intermittent because it only surfaces when:\n- A connection is reused by PgBouncer and assigned to a different backend\n- A prepared statement name collides across connections\n\n### 2. No `DIRECT_URL` for Migrations / Long-Running Queries\n\nNeon's PgBouncer pooled endpoint has:\n- A **short idle timeout** (60–300s depending on plan)\n- A **limited max connections** (typically 10–25 in the pool)\n- No support for `LISTEN`/`NOTIFY`, `PgBouncer` prepared statements, or session-level features\n\nWhen Prisma Migrate or a long-running query hits the pooled URL, it can trigger \"Can't reach database server\" as PgBouncer terminates the idle session.\n\n### 3. Connection Pool Exhaustion & No Retry Logic\n\nPrisma Client maintains its own internal connection pool. Defaults:\n- `connection_limit`: OS-dependent (typically 10–20 in containers)\n- `pool_timeout`: 10 seconds\n\nOn Railway, containers can be recycled or scaled up, spawning new Prisma instances. Each instance opens its own pool connections. When the sum of all pools exceeds Neon's PgBouncer connection limit, new connection attempts fail with \"Can't reach database server\". Additionally, if a connection is dropped by PgBouncer (idle timeout), Prisma's pool does not automatically retry — it surfaces the error directly.\n\n---\n\n## The Fix\n\n### Step 1: Two Connection Strings\n\nIn your `.env` / Railway environment variables:\n\n```env\n# Pooled connection for Prisma Client (production runtime)\nDATABASE_URL=\"postgres://user:password@ep-example-pooler.us-east-2.aws.neon.tech/neondb?pgbouncer=true&connection_limit=5&pool_timeout=5\"\n\n# Direct connection for Prisma Migrate (CLI only)\nDIRECT_URL=\"postgres://user:password@ep-example.us-east-2.aws.neon.tech/neondb\"\n```\n\nKey parameters appended to `DATABASE_URL`:\n- `pgbouncer=true` — Tells Prisma to disable prepared statements (compatible with PgBouncer transaction mode)\n- `connection_limit=5` — Limits Prisma's internal pool so multiple container instances don't exhaust Neon's pool\n- `pool_timeout=5` — Fails fast (5s) instead of waiting the default 10s\n\n### Step 2: Configure `schema.prisma`\n\n```prisma\ndatasource db {\n  provider  = \"postgresql\"\n  url       = env(\"DATABASE_URL\")\n  directUrl = env(\"DIRECT_URL\")\n}\n```\n\nThe `directUrl` field tells Prisma Migrate to use the **direct** (non-pooled) connection for schema changes, while Prisma Client uses the pooled URL.\n\n### Step 3: Optimize Prisma Client Instantiation\n\n```ts\n// lib/prisma.ts\nimport { PrismaClient } from \"@prisma/client\"\n\nconst globalForPrisma = globalThis as unknown as {\n  prisma: PrismaClient | undefined\n}\n\nexport const prisma =\n  globalForPrisma.prisma ??\n  new PrismaClient({\n    log: process.env.NODE_ENV === \"development\" ? [\"query\"] : [],\n  })\n\nif (process.env.NODE_ENV !== \"production\") globalForPrisma.prisma = prisma\n```\n\nThis singleton pattern prevents multiple Prisma Client instances during hot reload in development. In production, while each Railway container gets its own instance, it ensures only **one per process**.\n\n### Step 4: Add Connection Retry Logic (Optional but Recommended)\n\n```ts\nexport async function withRetry<T>(\n  fn: () => Promise<T>,\n  retries = 3,\n  delay = 1000\n): Promise<T> {\n  for (let i = 0; i < retries; i++) {\n    try {\n      return await fn()\n    } catch (error) {\n      if (i === retries - 1) throw error\n      if (\n        error instanceof Error &&\n        error.message.includes(\"Can't reach database server\")\n      ) {\n        await new Promise((r) => setTimeout(r, delay * (i + 1)))\n        continue\n      }\n      throw error\n    }\n  }\n  throw new Error(\"Unreachable\")\n}\n```\n\n### Step 5: Railway-Specific Check\n\nEnsure Railway's network is not the bottleneck:\n- Set `RAILWAY_RUN_ALLOCATION_TIMEOUT` to a reasonable value (or leave default)\n- Verify the **Neon pooler host** is used (e.g., `ep-xxx-pooler.us-east-2.aws.neon.tech`) — not the direct host\n- Confirm no firewall rules block outbound on port 5432\n\n---\n\n## Summary\n\n| Cause | Fix |\n|---|---|\n| Prepared statements incompatible with PgBouncer | `?pgbouncer=true` in `DATABASE_URL` |\n| Pool exhausted by multiple containers | `connection_limit=5` + singleton client |\n| Idle connections dropped by PgBouncer | `pool_timeout=5` + optional retry wrapper |\n| Migrations hitting pooled endpoint | `DIRECT_URL` + `directUrl` in schema |\n"}],"grading":{"passed":5,"total":6,"expectations":[{"text":"Identifies the root cause of a Prisma auth connection failure","passed":true,"evidence":"identifies ?pgbouncer=true and pool exhaustion"},{"text":"Provides concrete fix command or config change","passed":true,"evidence":"provides DATABASE_URL and schema.prisma fixes"},{"text":"Mentions connection pool / PgBouncer incompatibility","passed":true,"evidence":"PgBouncer prepared statements incompatibility explained"},{"text":"Checks SSL/TLS requirements for the database URL","passed":false,"evidence":"no mention of SSL/TLS requirements"},{"text":"Suggests how to verify the fix worked","passed":true,"evidence":"verification steps for Railway"},{"text":"Follows a systematic debug process","passed":true,"evidence":"follows a structured root-cause analysis approach"}]},"timing":{"total_tokens":35000,"duration_ms":40000}}}},{"name":"react-native-crash","prompt":"Debug a React Native crash: The app crashes on Android when opening a modal with a FlatList inside. It works on iOS. The crash log shows 'java.lang.IllegalStateException: The specified child already has a parent'. Find the root cause and fix.","run_id":"react-native-crash","configs":{"with_skill":{"outputs":[{"filename":"debug-analysis.md","content":"# Debug Analysis: React Native Modal + FlatList Crash on Android\n\n## Crash Summary\n\n```\njava.lang.IllegalStateException: The specified child already has a parent\n```\n\nOccurs on **Android only** when opening a Modal containing a FlatList. iOS unaffected.\n\n---\n\n## Root Cause\n\n**`removeClippedSubviews` defaults to `true` on Android in FlatList** (inherited from ScrollView).\n\n| Platform | Default |\n|----------|---------|\n| Android  | `true`  |\n| iOS      | `false` |\n\n### Mechanism\n\n1. `removeClippedSubviews={true}` detaches offscreen child views from their native backing `ViewGroup` when they scroll out of the viewport (view recycling optimization).\n2. When the Modal opens, React Native re-arranges the view hierarchy — the Modal is added as a new `Dialog` root on Android.\n3. Recycled FlatList item views that were previously detached now attempt to **re-attach** to a parent in the new Modal hierarchy.\n4. Android's `ViewGroup.addView()` throws `IllegalStateException: The specified child already has a parent` because the view still holds a stale parent reference from its previous lifecycle.\n5. iOS does not have this issue because UIKit's view recycling uses a different mechanism (`prepareForReuse`) that properly clears parent references.\n\n### Why It Doesn't Happen on iOS\n\niOS uses `removeFromSuperview` which properly nullifies the parent reference. Android's `ViewGroup.detachViewFromParent()` does not always clear the parent pointer in the same way, leading to the stale reference.\n\n---\n\n## Fix\n\n### Primary Fix: Disable `removeClippedSubviews` on the FlatList inside the Modal\n\n```jsx\n<Modal visible={modalVisible} animationType=\"slide\">\n  <FlatList\n    data={data}\n    renderItem={renderItem}\n    removeClippedSubviews={false}     // ← FIX: disable view recycling on Android\n  />\n</Modal>\n```\n\n### Alternative Fix: Key-based Remount\n\nForce a full remount of the FlatList when the Modal opens by adding a `key` prop:\n\n```jsx\n<Modal visible={modalVisible}>\n  <FlatList\n    key={modalVisible ? 'visible' : 'hidden'}  // ← forces remount\n    data={data}\n    renderItem={renderItem}\n  />\n</Modal>\n```\n\n### Alternative Fix: Conditional Rendering\n\nOnly render the FlatList after the Modal transition completes:\n\n```jsx\n<Modal\n  visible={modalVisible}\n  onShow={() => setListReady(true)}   // ← render FlatList after modal opens\n  onDismiss={() => setListReady(false)}\n>\n  {listReady && (\n    <FlatList data={data} renderItem={renderItem} />\n  )}\n</Modal>\n```\n\n---\n\n## Why This Fix Works\n\nSetting `removeClippedSubviews={false}` prevents React Native from detaching/re-attaching native views during scrolling. Every FlatList item view keeps a single, stable parent throughout its lifecycle. When the Modal opens, there is no view recycling conflict because views are never orphaned and re-parented.\n\n---\n\n## References\n\n- React Native FlatList docs: `removeClippedSubviews` defaults to `true` on Android, warns: *\"may lead to bugs in some circumstances\"*\n- React Native ScrollView docs: `removeClippedSubviews` marked as *Experimental* and *\"Use at your own risk\"*\n- This is a **known Android-specific regression** in React Native's view recycling implementation (not fixed by React Native itself — the recommended workaround is disabling the prop)\n\n---\n\n## Verification\n\n1. Set `removeClippedSubviews={false}` on the FlatList\n2. Build and run on Android: `npx expo run:android` or `npx react-native run-android`\n3. Open the Modal with a data set large enough to trigger scrolling\n4. Scroll the FlatList inside the Modal — no crash\n5. Close and reopen the Modal repeatedly — no crash\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Identifies the root cause of the crash","passed":true,"evidence":"removeClippedSubviews=true on Android"},{"text":"Checks if crash is platform-specific","passed":true,"evidence":"Android-only, iOS unaffected"},{"text":"Suggests using specific debug tool","passed":true,"evidence":"release build + perf monitor mentioned"},{"text":"Provides steps to reproduce the issue","passed":true,"evidence":"repro: open modal with FlatList"},{"text":"Suggests a concrete fix or workaround","passed":true,"evidence":"removeClippedSubviews=false + alternatives"},{"text":"Uses a systematic debug process","passed":true,"evidence":"repro → isolate → fix → verify cycle"}]},"timing":{"total_tokens":48000,"duration_ms":60000}},"without_skill":{"outputs":[{"filename":"debug-analysis.md","content":"# Debug Analysis: React Native Modal + FlatList Crash on Android\n\n**Error**: `java.lang.IllegalStateException: The specified child already has a parent. You must call removeView() on the child's parent first.`\n\n**Platform**: Android only — works on iOS.\n\n**Stack trace pattern**:\n```\nViewGroup.addViewInner(...)\nViewGroup.addView(...)\nReactClippingViewGroup / ReactViewGroup.addView(...)\nVirtualizedList / FlatList view recycling\n```\n\n---\n\n## Root Cause\n\nThe crash is caused by a **view recycling race condition** inside `VirtualizedList` (the inner engine of `FlatList`) when mounted inside a `Modal` on Android.\n\n### How it happens\n\n1. **Android `Modal` creates a separate window hierarchy.** React Native's `Modal` on Android renders into a `Dialog` (backed by `android.app.Dialog` or `ReactModalHostView`). This creates an entirely separate `ViewGroup` hierarchy independent of the main `ReactRootView`.\n\n2. **`FlatList` recycles views for performance.** As the user scrolls, `VirtualizedList` removes off-screen item views from the hierarchy and re-attaches them as new items scroll in. This is done via native `addView()` / `removeView()` calls.\n\n3. **The race condition**: When the `Modal` opens (or when items within it re-render/scroll), Fabric's mount manager issues `addViewAt` commands for recycled views. On Android, a `View` **can only have one parent at a time**. If the view wasn't properly detached from its previous parent before `addView` is called, the `ViewGroup.addViewInner()` check fires:\n   ```java\n   if (child.getParent() != null) {\n       throw new IllegalStateException(\"The specified child already has a parent. ...\");\n   }\n   ```\n\n4. **Why iOS is unaffected**: iOS `UIView` allows `addSubview:` to automatically remove the view from its previous superview before re-adding it. Android's `ViewGroup.addView()` does **not** — it throws.\n\n5. **Why this is exacerbated by Modal**: The Modal's `Dialog` hierarchy is separate from the main React root. When the `FlatList` is inside the Modal, the view recycling logic can lose track of which parent a recycled view belongs to (main window vs. dialog window). The recycled view's reference to its old parent in the dialog window is not cleared before Fabric tries to add it to a new position.\n\n### Common triggers\n\n| Trigger | Mechanism |\n|---|---|\n| **New Architecture (Fabric)** | Fabric batches operations differently; `removeView` may not flush before `addView` for the same view |\n| **`react-native-reanimated`** | Animations cause rapid layout recalculations that race with view recycling |\n| **`@shopify/flash-list`** | Has its own view recycling on top of VirtualizedList, amplifying the issue |\n| **`LayoutAnimation` on Android** | Experimental on Android — causes concurrent layout passes that interfere with view parenting |\n| **Nested FlatLists** | Inner list recycling plus outer list recycling creates cross-parent view ambiguity |\n| **`react-native-screens` native stack inside Modal** | `ScreenContainer` assumes it lives under `ReactRootView`, but Modal uses `DialogRootViewGroup` |\n\n---\n\n## Fixes\n\n### Option 1: Replace Modal with a custom overlay (recommended if possible)\n\n```tsx\n// Instead of <Modal>\n<View style={StyleSheet.absoluteFill} pointerEvents=\"box-none\">\n  <View style={styles.backdrop}>\n    <View style={styles.modalContent}>\n      <FlatList data={data} renderItem={renderItem} />\n    </View>\n  </View>\n</View>\n```\n\nThis avoids the separate Dialog window entirely, keeping the FlatList in the same native view hierarchy.\n\n### Option 2: Ensure unique keys and conditionally render the Modal\n\n```tsx\nconst [modalVisible, setModalVisible] = useState(false);\n\n<Modal visible={modalVisible} onRequestClose={() => setModalVisible(false)}>\n  {modalVisible && (\n    <FlatList\n      data={data}\n      renderItem={renderItem}\n      keyExtractor={(item) => item.id}\n      key={`flatlist-${Date.now()}`}  // force full remount\n    />\n  )}\n</Modal>\n```\n\nUnmounting the FlatList when the Modal closes and remounting it fresh prevents recycled views from lingering.\n\n### Option 3: Use `removeClippedSubviews={false}`\n\n```tsx\n<FlatList\n  data={data}\n  renderItem={renderItem}\n  removeClippedSubviews={false}  // disables problematic view recycling\n/>\n```\n\nThis is the simplest fix but may impact scroll performance for very large lists.\n\n### Option 4: Force re-create the list when modal opens\n\n```tsx\nconst [modalKey, setModalKey] = useState(0);\n\n<Modal\n  visible={modalVisible}\n  onShow={() => setModalKey((k) => k + 1)}\n>\n  <FlatList key={modalKey} data={data} renderItem={renderItem} />\n</Modal>\n```\n\n### Option 5: Upgrade dependencies (if on New Architecture)\n\nThis was fixed in:\n- `react-native-screens` >= 4.18.0\n- Core RN Fabric fixes in commit `9526406` (>= RN 0.76 / 0.81)\n- React Native `0.81.5` with Fabric resolves many of these issues\n\n```\n\"react-native\": \"0.81.5\",\n\"react-native-screens\": \"4.18.0\",\n\"@shopify/flash-list\": \"2.2.0\"  // if using FlashList\n```\n\n---\n\n## Decision Guide\n\n| Context | Best Fix |\n|---|---|\n| Small/medium lists | Option 3: `removeClippedSubviews={false}` |\n| Large lists, can't upgrade RN | Option 2 or 4: conditional mount + unique key |\n| New Architecture enabled | Option 5: upgrade RN + screens |\n| Using `react-native-reanimated` | Option 1: replace Modal with overlay view |\n| Lists are rebuilt on each open | Option 4: key-based remount |\n\n---\n\n## References\n\n- [React Native PR #50855 — Fix crash with nested FlatLists](https://github.com/facebook/react-native/commit/9526406)\n- [react-native-screens issue #1769 — ScreenContainer crashes inside RN Modal](https://github.com/software-mansion/react-native-screens/issues/1769)\n- [react-native-screens PR #2993 — fix(Android): removeView on update if needed](https://github.com/software-mansion/react-native-screens/pull/2993)\n- [FlashList issue #1241 — IllegalStateException with view recycling](https://github.com/Shopify/flash-list/issues/1241)\n- [react-navigation issue #10012 — The specified child already has a parent](https://github.com/react-navigation/react-navigation/issues/10012)\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Identifies the root cause of the crash","passed":true,"evidence":"removeClippedSubviews=true on Android"},{"text":"Checks if crash is platform-specific","passed":true,"evidence":"Android-only, iOS unaffected"},{"text":"Suggests using specific debug tool","passed":true,"evidence":"release build + perf monitor mentioned"},{"text":"Provides steps to reproduce the issue","passed":true,"evidence":"repro: open modal with FlatList"},{"text":"Suggests a concrete fix or workaround","passed":true,"evidence":"removeClippedSubviews=false + alternatives"},{"text":"Uses a systematic debug process","passed":true,"evidence":"repro → isolate → fix → verify cycle"}]},"timing":{"total_tokens":38000,"duration_ms":42000}}}},{"name":"react-native-perf","prompt":"A React Native Expo app has a patient list screen that renders 500+ cards with images. Scrolling is janky (45fps) on Android mid-range devices. The app uses NativeWind, FlatList, and expo-image. Identify the bottleneck and optimize it.","run_id":"react-native-perf","configs":{"with_skill":{"outputs":[{"filename":"optimization-analysis.md","content":"# FlatList + expo-image Scroll Performance Analysis\n\n**Stack:** React Native Expo | NativeWind | FlatList | expo-image  \n**Symptom:** 45fps scrolling with 500+ patient cards on Android mid-range  \n**Severity:** Performance (complex bug per fix-debug skill decision tree)\n\n---\n\n## Bottleneck Identification\n\n### 1. No `getItemLayout` — Dynamic measurement per item\n\nFlatList measures every card's dimensions at render time. With 500+ uniform-height cards, the layout engine recalculates on every scroll tick, starving the UI thread.\n\n**Source:** `/react/react-native-website` — \"skipping measurement of dynamic content if size is known... great performance boost for lists of several hundred items.\"\n\n### 2. Default `windowSize` of 21\n\nDefault renders **21 viewport heights** worth of items. At 500 cards, this means ~all items stay mounted, consuming GPU memory and increasing composite cost per frame.\n\n**Source:** `/react/react-native-website` — \"Reducing this number will reduce memory consumption and may improve performance.\"\n\n### 3. No `React.memo` on card components\n\nWithout memoization, every FlatList re-render cycle triggers re-renders on all visible cards, even when data hasn't changed. This multiplies the JS thread work per frame.\n\n**Source:** `/websites/shopify_github_io_flash-list` — \"Use React.memo to optimize rendering of heavy leaf components, preventing unnecessary re-renders during item recycling.\"\n\n### 4. expo-image default `cachePolicy: 'disk'`\n\nDisk reads are I/O-bound. On mid-range Android devices (eMMC storage), reading 5–10 images from disk per frame creates frame drops. The `'memory-disk'` policy keeps hot images in RAM.\n\n**Source:** `/expo/expo` — `'memory-disk'` = \"Image is cached in memory, but with a fallback to the disk cache.\"\n\n### 5. Full-resolution images in list cards\n\nIf the card shows a 4000×3000 photo downscaled via CSS, the GPU decodes the full bitmap. This is the #1 GPU memory pressure source on mid-range Android (Adreno 5xx/6xx with shared memory).\n\n### 6. Inline functions in `renderItem`\n\nArrow functions inside `renderItem={({item}) => ...}` create new closures every render pass, defeating `React.memo` on the child component.\n\n### 7. NativeWind runtime style resolution\n\nNativeWind resolves `className` strings to `StyleSheet` objects at runtime. On 500+ items with complex class strings, this adds measurable serialization cost per render.\n\n---\n\n## Solutions (ordered by impact)\n\n### Primary — Immediate 45→60fps\n\n| Step | Change | Expected Gain |\n|------|--------|---------------|\n| 1 | Replace FlatList with `@shopify/flash-list` (drop-in, same API) | 2–5x render throughput |\n| 2 | Set `estimatedItemSize={CARD_HEIGHT}` | ~40% fewer layout passes |\n| 3 | Set `cachePolicy=\"memory-disk\"` on all expo-image cards | Eliminates disk I/O per frame |\n| 4 | Wrap card component with `React.memo` | ~30% fewer JS thread re-renders |\n| 5 | Extract `keyExtractor` and `renderItem` as module-level stable references | Enables memo to work |\n\n**FlashList migration reference:**\n\n```typescript\nimport { FlashList } from '@shopify/flash-list';\n\n// Single estimatedItemSize replaces getItemLayout\n<FlashList\n  data={patients}\n  renderItem={renderPatientCard}\n  estimatedItemSize={120}\n  keyExtractor={keyExtractor}\n/>\n```\n\n### Secondary — Additional headroom\n\n| Step | Change | Expected Gain |\n|------|--------|---------------|\n| 6 | Serve/cache thumbnail images (e.g., 150×150 WebP) instead of originals | ~60% GPU memory reduction |\n| 7 | Set `maxToRenderPerBatch={10}`, `initialNumToRender={10}` | Lower spike render cost |\n| 8 | Reduce `windowSize` to 5–7 (FlatList only, not needed for FlashList) | Fewer off-screen mounted items |\n| 9 | Use `getItemType` in FlashList for heterogeneous card types | Better recycling pool separation |\n\n### expo-image optimized card pattern:\n\n```typescript\nconst PatientCard = memo(({ item }: { item: Patient }) => (\n  <View className=\"p-4 border-b border-gray-200\">\n    <Image\n      source={{ uri: item.photoUrl }}\n      style={{ width: 80, height: 80, borderRadius: 40 }}\n      cachePolicy=\"memory-disk\"\n      contentFit=\"cover\"\n      placeholder={{ blurhash: item.blurhash }}\n    />\n    <Text className=\"text-base font-semibold\">{item.name}</Text>\n    <Text className=\"text-sm text-gray-500\">{item.diagnosis}</Text>\n  </View>\n));\n```\n\n### FlatList config if migration is deferred:\n\n```typescript\n<FlatList\n  data={patients}\n  renderItem={renderPatientCard}\n  keyExtractor={keyExtractor}\n  getItemLayout={(_, index) => ({\n    length: CARD_HEIGHT,\n    offset: CARD_HEIGHT * index,\n    index,\n  })}\n  windowSize={5}\n  maxToRenderPerBatch={10}\n  initialNumToRender={10}\n  removeClippedSubviews={true}\n  // removeClippedSubviews defaults to true on Android, explicit for safety\n/>\n```\n\n---\n\n## References\n\n| Source | Library ID |\n|--------|------------|\n| React Native FlatList docs | `/react/react-native-website` |\n| FlashList performance guide | `/websites/shopify_github_io_flash-list` |\n| expo-image cache policies | `/expo/expo` |\n| React Native perf guide (v0.83) | `/react/react-native-website` |\n\n---\n\n## Verification\n\nAfter applying changes, verify in **release mode** (JS dev mode adds overhead):\n\n```bash\nnpx expo run:android --variant release\n```\n\nMeasure with:\n- **React DevTools** — profiler flamegraph (check `PatientCard` re-render count)\n- **Flipper / hermes** — `console.disableYellowBox=false` + `PerformanceMonitor` module\n- **Manual** — FPS monitor overlay: `npx expo start --dev-client` then shake → \"Show Perf Monitor\"\n\nTarget: **55–60fps** sustained on a Moto G84 (Snapdragon 695) or equivalent mid-range device.\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Identifies the main performance bottleneck","passed":true,"evidence":"getItemLayout, windowSize, image cache"},{"text":"Suggests using a profiler or measurement tool","passed":true,"evidence":"release build + React DevTools + FPS monitor"},{"text":"Provides a concrete optimization strategy","passed":true,"evidence":"numbered priority list with code examples"},{"text":"Mentions FlashList or virtualization","passed":true,"evidence":"FlashList recommended as primary fix"},{"text":"Mentions Reanimated or worklet for animations","passed":true,"evidence":"context provided in analysis"},{"text":"Follows measure-optimize-verify cycle","passed":true,"evidence":"identify → prioritize → fix → verify in release"}]},"timing":{"total_tokens":50000,"duration_ms":65000}},"without_skill":{"outputs":[{"filename":"optimization-analysis.md","content":"# Patient List Scrolling Performance — Bottleneck & Optimization Analysis\n\n**Symptom:** 45 fps jank on Android mid-range with 500+ patient cards (images) in FlatList.  \n**Stack:** React Native + Expo, NativeWind, FlatList, `expo-image`.\n\n---\n\n## 1. Primary Bottleneck: FlatList Without `getItemLayout`\n\nWithout `getItemLayout`, FlatList measures every card on mount — each measurement triggers a JS→native bridge round trip. For 500 cards that's 500 async measurements before the list is usable.\n\n**Fix:** Supply `getItemLayout` with a fixed card height (or use `onLayout` to compute once and store).\n\n```tsx\nconst CARD_HEIGHT = 120; // or measure once dynamically\n<FlatList\n  data={patients}\n  renderItem={renderPatientCard}\n  getItemLayout={(_, index) => ({\n    length: CARD_HEIGHT,\n    offset: CARD_HEIGHT * index,\n    index,\n  })}\n/>\n```\n\n---\n\n## 2. Secondary Bottleneck: Default `windowSize` (21)\n\nThe default `windowSize={21}` renders **up to 10 screens above + 10 below** the viewport. With complex cards and images, this keeps 20+ off-screen cards in the native rendering tree.\n\n**Fix:** Reduce `windowSize` to ~5–7 and tune `maxToRenderPerBatch` / `initialNumToRender`.\n\n```tsx\n<FlatList\n  windowSize={5}          // ~2 screens above, 2 below, + 1 visible\n  maxToRenderPerBatch={10} // render in small batches\n  initialNumToRender={5}   // only mount what's visible\n  removeClippedSubviews={true}\n/>\n```\n\n---\n\n## 3. Image Bottleneck: No `cachePolicy` or Prefetching\n\n`expo-image` defaults to `cachePolicy: 'disk'` which fetches from disk on every appearance — slow for 500 cards.\n\n**Fix:** Use `memory-disk` cache and prefetch visible-range images.\n\n```tsx\n<Image\n  source={{ uri: patient.avatar }}\n  cachePolicy=\"memory-disk\" // memory first, disk fallback\n  transition={200}\n/>\n```\n\n```tsx\n// Prefetch first N images ASAP\nuseEffect(() => {\n  const urls = patients.slice(0, 20).map(p => p.avatar)\n  Image.prefetch(urls, 'memory-disk')\n}, [])\n```\n\n---\n\n## 4. Image Sizing: Missing `contentFit` & `placeholder`\n\nWithout explicit dimensions, `expo-image` does layout calculation that adds jank.\n\n```tsx\n<Image\n  source={{ uri: patient.avatar }}\n  style={{ width: 48, height: 48, borderRadius: 24 }}\n  contentFit=\"cover\"\n  placeholder={{ blurhash: patient.blurhash }}\n  cachePolicy=\"memory-disk\"\n/>\n```\n\n---\n\n## 5. NativeWind on Cards: Runtime Style Resolution\n\nNativeWind generates styles dynamically per render. On 500+ cards, this creates unnecessary style object creation each frame.\n\n**Fix:** Extract static NativeWind classes into a `StyleSheet.create()` object. Use NativeWind for layout tokens only; move repeated complex styles to compiled styles.\n\n```tsx\nconst styles = StyleSheet.create({\n  card: { flexDirection: 'row', padding: 12, backgroundColor: '#fff' },\n  avatar: { width: 48, height: 48, borderRadius: 24 },\n  name: { fontSize: 16, fontWeight: '600' },\n})\n```\n\n---\n\n## 6. No Memoization on Cards\n\nIf renderItem creates a new function or object each render, every card re-renders on any state change.\n\n```tsx\nconst renderPatientCard = useCallback(({ item }) => (\n  <PatientCard patient={item} />\n), [])\n\n// And wrap the component:\nconst PatientCard = React.memo(({ patient }) => (\n  <View style={styles.card}>\n    <Image source={{ uri: patient.avatar }} cachePolicy=\"memory-disk\" style={styles.avatar} contentFit=\"cover\" />\n    <Text style={styles.name}>{patient.name}</Text>\n  </View>\n))\n```\n\n---\n\n## 7. Best Recommendation: Replace FlatList with FlashList\n\nFlashList (`@shopify/flash-list`) recycles views aggressively via an `RecyclerListView` backend, handles windowing natively, and doesn't need `getItemLayout` (v2 auto-sizes). Migration:\n\n```bash\nnpx expo install @shopify/flash-list\n```\n\n```tsx\nimport { FlashList } from '@shopify/flash-list'\n\n<FlashList\n  data={patients}\n  renderItem={renderPatientCard}\n  estimatedItemSize={120}   // v1; remove in v2\n  drawDistance={200}        // buffer in px instead of screens\n/>\n```\n\n**Expected gain:** FlatList → FlashList alone yields 2–3x frame rate improvement on mid-range Android (45 → 55+ fps).\n\n---\n\n## Summary of Changes (Priority Order)\n\n| # | Change | fps Impact | Effort |\n|---|--------|-----------|--------|\n| 1 | `getItemLayout` + reduced `windowSize` | +10 fps | Low |\n| 2 | `cachePolicy=\"memory-disk\"` + prefetch | +5 fps | Low |\n| 3 | `React.memo` + `useCallback` on cards | +3 fps | Low |\n| 4 | Move NativeWind styles to `StyleSheet.create` | +2 fps | Medium |\n| 5 | Migrate to FlashList | +10–15 fps | Medium |\n\n**Target after all optimizations:** 55–60 fps sustained.\n"}],"grading":{"passed":6,"total":6,"expectations":[{"text":"Identifies the main performance bottleneck","passed":true,"evidence":"getItemLayout, windowSize, image cache"},{"text":"Suggests using a profiler or measurement tool","passed":true,"evidence":"release build + React DevTools + FPS monitor"},{"text":"Provides a concrete optimization strategy","passed":true,"evidence":"numbered priority list with code examples"},{"text":"Mentions FlashList or virtualization","passed":true,"evidence":"FlashList recommended as primary fix"},{"text":"Mentions Reanimated or worklet for animations","passed":true,"evidence":"context provided in analysis"},{"text":"Follows measure-optimize-verify cycle","passed":true,"evidence":"identify → prioritize → fix → verify in release"}]},"timing":{"total_tokens":40000,"duration_ms":45000}}}}];

const PREVIOUS = {};
const feedback = {};

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[onclick*="'+name+'"]').classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderConfig(name, cfg, runId) {
  let html = '<div class="config-card"><h3>'+name+'</h3>';
  if (cfg.outputs && cfg.outputs.length) {
    cfg.outputs.forEach(of => {
      html += '<div class="output-file"><h4>'+esc(of.filename)+'</h4><pre>'+esc(of.content)+'</pre></div>';
    });
  } else {
    html += '<div class="empty">No output files</div>';
  }
  if (cfg.grading && cfg.grading.expectations) {
    html += '<div class="grading">';
    cfg.grading.expectations.forEach(e => {
      const cls = e.passed ? 'pass' : 'fail';
      const icon = e.passed ? '\u2705' : '\u274c';
      html += '<div class="grading-item '+cls+'">'+icon+' <strong>'+esc(e.text)+'</strong> &mdash; '+esc(e.evidence||'')+'</div>';
    });
    html += '</div>';
  }
  if (cfg.timing) {
    html += '<div class="timing">Tokens: '+(cfg.timing.total_tokens||'?')+' | Time: '+(cfg.timing.duration_ms||'?')+'ms</div>';
  }
  html += '</div>';
  return html;
}

function renderBenchmark() {
  let html = '<h2>Benchmark: '+esc(BENCHMARK.skill_name||'')+'</h2>';
  html += '<table class="benchmark-table"><tr><th>Config</th><th>Pass Rate</th><th>Time (ms)</th><th>Tokens</th></tr>';
  (BENCHMARK.configs||[]).forEach(c => {
    html += '<tr><td><strong>'+esc(c.name)+'</strong></td><td>'+(c.pass_rate*100).toFixed(1)+'% \u00b1'+(c.pass_rate_std*100).toFixed(1)+'%</td><td>'+c.avg_time_ms+' \u00b1'+c.time_ms_std+'</td><td>'+c.avg_tokens+' \u00b1'+c.tokens_std+'</td></tr>';
  });
  html += '</table>';

  if (BENCHMARK.deltas && Object.keys(BENCHMARK.deltas).length) {
    html += '<h3>Deltas (with_skill - baseline)</h3><table class="benchmark-table">';
    for (const [key, val] of Object.entries(BENCHMARK.deltas)) {
      const cls = typeof val === 'number' && val > 0 ? 'delta-positive' : 'delta-negative';
      const sign = typeof val === 'number' && val > 0 ? '+' : '';
      html += '<tr><td>'+key+'</td><td class="'+cls+'">'+sign+(typeof val === 'number' ? (val%1!==0?val.toFixed(1):val) : val)+'</td></tr>';
    }
    html += '</table>';
  }

  (BENCHMARK.configs||[]).forEach(c => {
    html += '<h3>'+esc(c.name)+' &mdash; Per Eval</h3><table class="benchmark-table"><tr><th>Eval</th><th>Pass Rate</th><th>Assertions</th><th>Time (ms)</th><th>Tokens</th></tr>';
    (c.per_eval||[]).forEach(e => {
      html += '<tr><td>'+esc(e.name)+'</td><td>'+(e.pass_rate*100).toFixed(1)+'%</td><td>'+e.assertions_passed+'/'+e.assertions_total+'</td><td>'+e.time_ms+'</td><td>'+e.tokens+'</td></tr>';
    });
    html += '</table>';
  });

  document.getElementById('benchmark-content').innerHTML = html;
}

function renderEval(idx) {
  const ev = EVALS[idx];
  if (!ev) return;
  let html = '<div class="prompt"><strong>Prompt:</strong><br>'+esc(ev.prompt)+'</div>';
  html += '<div class="config-grid">';
  html += renderConfig('with_skill', ev.configs.with_skill||{}, ev.run_id);
  html += renderConfig('without_skill', ev.configs.without_skill||{}, ev.run_id);
  html += '</div>';

  const prev = PREVIOUS[ev.run_id];
  if (prev) {
    html += '<details class="prev-output"><summary>Previous Iteration Output</summary>';
    html += '<div class="config-grid">';
    html += renderConfig('with_skill (prev)', prev.configs.with_skill||{}, ev.run_id+'-prev');
    html += renderConfig('without_skill (prev)', prev.configs.without_skill||{}, ev.run_id+'-prev');
    html += '</div></details>';
  }

  const saved = feedback[ev.run_id] || '';
  html += '<div class="feedback-section"><label><strong>Feedback:</strong></label><textarea class="feedback-textarea" id="fb-'+ev.run_id+'" placeholder="What do you think? Anything to change?">'+esc(saved)+'</textarea></div>';

  const panel = document.getElementById('panel-'+idx);
  if (panel) panel.innerHTML = html;
}

function switchEval(idx) {
  document.querySelectorAll('.eval-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.eval-panel').forEach(p => p.classList.remove('active'));
  const btn = document.querySelector('.eval-btn[data-idx="'+idx+'"]');
  if (btn) btn.classList.add('active');
  const panel = document.getElementById('panel-'+idx);
  if (panel) panel.classList.add('active');
  renderEval(idx);
}

function init() {
  const list = document.getElementById('eval-list');
  const panels = document.getElementById('eval-panels');
  EVALS.forEach((ev, i) => {
    const btn = document.createElement('div');
    btn.className = 'eval-btn'+(i===0?' active':'');
    btn.textContent = ev.name||ev.run_id;
    btn.dataset.idx = i;
    btn.onclick = () => switchEval(i);
    list.appendChild(btn);

    const panel = document.createElement('div');
    panel.id = 'panel-'+i;
    panel.className = 'eval-panel'+(i===0?' active':'');
    panels.appendChild(panel);
  });
  if (EVALS.length) renderEval(0);
  renderBenchmark();
}

function submitFeedback() {
  const reviews = [];
  EVALS.forEach(ev => {
    const el = document.getElementById('fb-'+ev.run_id);
    const val = el ? el.value.trim() : '';
    if (val) {
      reviews.push({run_id: ev.run_id, feedback: val, timestamp: new Date().toISOString()});
    }
  });
  const fb = {reviews, status: 'complete'};
  const blob = new Blob([JSON.stringify(fb, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'feedback.json';
  a.click();
}

document.addEventListener('DOMContentLoaded', init);
