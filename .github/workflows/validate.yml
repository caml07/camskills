name: Validate CamSkills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Installer and routing checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check launcher syntax
        run: bash -n setup install.sh
      - name: Test installer with isolated directories
        run: python3 -m unittest discover -s tests -v
      - name: Validate Cam Route
        run: node --test scripts/check-cam-route.mjs
